# The release edits of the Overleaf text: anchored, exact replacements that sync_overleaf.sh applies after the flattening (paths
# are already fig/, latex/, sec/). Each `old` must occur exactly once (twice is an error); an `old` that no longer occurs is
# reported as "not applicable" (the upstream text changed: drop the edit, or redo it on the new text).
#
# Release mechanics only: no edit decides the authors' text. The tool FAILS on any \todo / \TODO left in the text — an open note
# of the authors is resolved on Overleaf, never here (owner, 2026-11-19).

# Comments of the public tree (no reference to a submission; no file the release does not ship)

