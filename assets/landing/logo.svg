<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Real Cameras are Radiometric">
  <defs>
    <radialGradient id="vig" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="0.55" stop-color="#f1e6c4"/>
      <stop offset="0.85" stop-color="#b9ae90"/>
      <stop offset="1" stop-color="#6f6853"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="308" height="308" rx="46" fill="#14171c"/>
  <!-- the image circle of a lens, its brightness falling off toward the rim: vignetting -->
  <circle cx="160" cy="160" r="134" fill="url(#vig)" stroke="#14171c" stroke-width="1.5"/>
  <!-- the focus surface -->
  <path d="M 159.8 69.6 A 118 118 0 0 1 159.8 250.4" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- the rays through the aperture meet in the point of focus and spread again -->
  <path d="M 84.0 126.0 L 261.3 237.3 M 84.0 194.0 L 261.3 197.9" fill="none" stroke="#1f4fa8" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 84 160 L 261.3 217.6" fill="none" stroke="#14171c" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 261.3 237.3 L 261.3 197.9" fill="none" stroke="#1f4fa8" stroke-width="7" stroke-linecap="round"/>
  <!-- the aperture stop and its center -->
  <path d="M 84 78 L 84 126 M 84 194 L 84 242" fill="none" stroke="#14171c" stroke-width="9" stroke-linecap="round"/>
  <circle cx="84" cy="160" r="4.5" fill="#14171c"/>
  <circle cx="196.2" cy="196.5" r="7" fill="#c0392b" stroke="#fff8e1" stroke-width="2"/>
</svg>
