name: Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Install site dependencies
        run: julia --project=site -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy the site
        env:
          # deploys to the gh-pages branch of this repository: no deploy key
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=site site/make.jl
