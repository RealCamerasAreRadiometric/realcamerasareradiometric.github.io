# The repository's entries for VisualGeometryToolkitCore's `check_duplication` (the monorepo's format,
# VisualGeometryToolkit.jl/DUPLICATION.toml), at the repository root, where the checker reads it (its git root's file:
# until 2026-11-25 this file sat in RadiometricCamera/, where no check read it). RadiometricCamera's quality test runs
# `check_duplication(RadiometricCamera)` (test/unit/quality_gates_tests.jl). Owner rulings: zero duplication, no
# exemptions (2026-11-25); every remaining entry is TEMPORARY and names the event that removes it. An entry that
# stops matching anything is itself a finding: remove it. Paths are relative to this file (the repository root).

# ---- the backend branches: one kernel, a parameter per backend -------------------------------------------------
# TEMPORARY, each: removed when VisualGeometryToolkitCore 0.13.4's device-policy functions (the backend host predicate, the
# kernel float, the Jacobian chunk, the OnBackend CPU workgroup, the CPU device_resident_threads) are forward-ported to the
# solve branch and RadiometricCamera calls them in place of its copies.

[[backend]]
file = "RadiometricCamera/src/calibration/device/workers.jl"
function = "_jac_chunk"
reason = "not a CPU/GPU twin of any computation: the same Jacobian kernel runs on every backend; only its dual-chunk width is chosen per backend (all slots in one sweep on the CPU, the state's jacobian_chunk on a device for register pressure)"

[[backend]]
file = "RadiometricCamera/src/calibration/device/workers.jl"
function = "_kernel_float"
reason = "not a CPU/GPU twin of any computation: the same kernels run on every backend; only their float type is chosen per backend (Float64 on the CPU, Float32 on a device)"

[[backend]]
file = "RadiometricCamera/src/calibration/device/flux_kernels.jl"
function = "_pixel_workgroup"
reason = "not a CPU/GPU twin of any computation: the same per-pixel kernels run on every backend; only their workgroup size is chosen per backend (16 pixels on the CPU so that every thread works on a small view, the kernel's register budget on a device)"

[[backend]]
file = "RadiometricCamera/src/calibration/device/jacobian_kernels.jl"
function = "_ensure_device!"
reason = "a transfer skip, not a second implementation: on the CPU backend with the settings' float the kernels read the host scene itself instead of an adapted copy; every backend then runs the same kernels"

[[backend]]
file = "RadiometricCamera/src/calibration/lm/per_view.jl"
function = "_window_width"
reason = "not a CPU/GPU twin of any computation: the same blocks run on every backend; only how many run concurrently is chosen per backend (the CPU's threads; a device's kernel occupancy and free memory, owner ruling 2026-11-13)"

[[backend]]
file = "RadiometricCamera/src/options/device.jl"
function = "rc_backend"
reason = "the device resolver's fallback, not a twin: it reports (loudly) that Core's resolver returned the CPU where a GPU was asked for; the kernels are the same on either backend"

[[backend]]
file = "RadiometricCamera/src/options/device.jl"
function = "default_backend"
reason = "the default device's one CPU warning, not a twin: Core's resolver returned the CPU and the run is told it will be slow; the kernels are the same on either backend"

[[backend]]
file = "RadiometricCamera/benchmark/run.jl"
function = "device_name"
reason = "the benchmark report's device label (the CPU's model and threads, a device's name), not a computation; removed with the others when Core's device_names entry of the CPU is forward-ported"

# ---- the sensor characterisation's producer (owner ruling D12) ---------------------------------------------------------------

[[pattern]]
use = "sensor_component"
file = "experiments/src/sensor_characterization.jl"
reason = "the record's producer composes Core's measured components (MasterDark, defect_onsets, PhotonTransfer) into a SensorCharacterization; coordinator ruling 2026-11-14, scoped to this file, every consumer resolving the record through Core's sensor_model. TEMPORARY: removed when VisualGeometryToolkitCore gains the public builder of a characterisation (from its darks and flats), the producer calling it"

