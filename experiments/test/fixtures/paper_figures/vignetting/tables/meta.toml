# The tables of the vignetting figure (src/paper_figures/vignetting.jl), written by scripts/vignetting_figure.jl: per lens
# <lens>_diagonal.tsv — t, px along the sensor's diagonal from the centre of the learned vignetting; the diffuser's flat field,
# the learned vignetting and cos(atan(|t| / f_px))^4, each over its value at the centre. [lenses.<lens>]: the lens's name, the
# thin lens model's focal length (f_mm, and f_px in the sensor's pixels), the centre and the ends of its diagonal;
# [sources.<lens>]: where its curves come from.
diagonal_ymax = 1.08
order = ["fourteen", "fisheye", "tamron"]

