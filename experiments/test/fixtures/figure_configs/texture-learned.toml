# A test fixture of the figure-config machinery (src/assets.jl: load_figure_config, deploy_figures; test/reproduce_tests.jl):
# the figure config that deployed texture-learned.png into the manuscript until the paper's own figures and tables replaced it
# (v0.11.6). The render is not part of the paper; no config of record deploys it.

[experiment]
name = "texture-learned"
generator = "scripts/texture_recovery.jl"

[runs]
experiment = "configs/experiments/texture_recovery_14mm_small.toml"

[render]
asset = "figures.texture_stacked"

[deploy]
replace_submitted = "off"   # true only once the author has signed off the difference verify.tsv states
