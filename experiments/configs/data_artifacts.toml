# =============================================================================
# data_artifacts — THE catalog of the experiments' published input data (VisualGeometryToolkitEval DataArtifacts): one entry per
# Julia artifact of ../Artifacts.toml (lazy, tree hash and sha256 pinned), what it holds, where it mounts and which rule selects its
# files. Only INPUTS are published — photographs, the external tools' outputs, the printed targets, the sensor model; every result
# is regenerated by the drivers into results_root().
#
#   scripts/make_artifacts.jl   packs the tiers from data_root() and binds ../Artifacts.toml (--dry-run: the tiers' files)
#   scripts/fetch_data.jl       installs them into the artifact store and links their trees into the data root (data/README.md)
#
# THE TIERS OF RECORD (packed 2026-11-21 from the data root of the run of record): one entry per tarball, kind `tree` with a
# `filter` (every file below `dir`, relative to the mount root data_root(), whose path matches a `filter` glob and no `!` glob),
# named `<tarball>_<yyyymmdd>`, `files` its file count as packed. Each entry's `tier` is the tier its files' inputs name in the
# configs of record (rc_raw_photos, rc_baselines, rc_calibration, rc_thorlabs, unpublished): an input's tier keys its runs
# (src/drivers.jl input_record), so the configs keep their names and the catalog says which entries hold each. The entries are
# grouped into the Zenodo records below (each under Zenodo's 50 GB and 100 files); a record binds its placeholder until it is
# published, and its trees reach a machine from the artifact store (VisualGeometryToolkitCore's artifact_store: the site profile's
# store, installed there from the packed tarballs), never from the depot.
#
# PRIVACY: the photographs DSC06045, DSC06052, DSC06053, DSC06054 and DSC06055 (the 14 mm Siemens-star session of 2026-11-03) show
# another person and are never in a tier or a record, under any prefix or extension. Every photograph entry excludes them by its
# `!` globs; src/data.jl `private_photographs` is the one rule; scripts/make_artifacts.jl refuses to pack, and its --check mode a
# staged tarball, that holds one; test/data_tests.jl checks every entry.
#
# THE RETIRED TIERS (packed 2026-10-29 / 2026-11-02, `retired = true`, not required): the first cut, kept on a private Hugging Face
# dataset (record `rc`); superseded by the tiers of record and read by no stage. Whether they are deleted from that dataset or kept
# is the owner's hosting decision; their bindings stay so that a machine that installed them still verifies them.
# =============================================================================

[catalog]
artifacts_toml = "../Artifacts.toml"
artifacts_toml_env = "EXPERIMENTS_ARTIFACTS_TOML"

[records.rc_ga_a]
title = "Real Cameras are Radiometric — input data I: calibration accuracy, Sigma 14 mm and Tamron 20 mm (Sony FX3 RAW)"
license = "CC-BY-4.0"
host = "zenodo"
placeholder = "ZENODO_RC_GA_A"

[records.rc_ga_b]
