# =============================================================================
# data_artifacts — THE catalog of the experiments' published input data (VisualGeometryToolkitEval DataArtifacts): one entry per
# Julia artifact of ../Artifacts.toml (lazy, tree hash and sha256 pinned), what it holds, where it mounts and which rule
# selects its files. Only INPUTS are published — photographs, renders, the baseline tools' outputs, the printed targets;
# every result is regenerated by the drivers into results_root().
#
#   scripts/make_artifacts.jl   packs the tiers from data_root() and binds ../Artifacts.toml (--dry-run: the tiers' files)
#   scripts/fetch_data.jl       installs them and links their trees into the data root (data/README.md)
#
# `files` is the tier's file count as packed (the suite checks data_root() against it: a tier that grows is a new version).
# Kind `tree` with a `filter` (VisualGeometryToolkitEval DataArtifacts): every file below `dir` (relative to the mount root,
# data_root()) whose path relative to the mount root matches a `filter` glob and no `!` glob (`*`, `?`, `**/`, a trailing `/**`). The trees keep the
# layout of data_root(), which is the layout of the retired experiments/ tree: the configs name inputs relative to it. A tier's
# name carries the date it was packed (`<tier>_<yyyymmdd>`); the configs' inputs name the tier without it (rc_raw_photos,
# rc_synthetic, rc_baselines, rc_calibration). A new version of a tier is a new entry and a new binding, never a changed tarball.
#
# rc_raw_photos, rc_synthetic and rc_baselines are disjoint; rc_calibration is self-contained — the targets and every input
# of the three golden calibration cases (configs/calibration/, the package's experiments/test/pipeline gate) — so it repeats a few files of
# rc_synthetic and rc_baselines (two views each of blobs_fisheye and fisheye_full, the Schöps calibrations the cases start from).
#
# THE PHOTOGRAPHS (2026-11-10): the raw photographs the configs of record read are the author's published folder
# radiometric-camera-paper-data on the university's MDS share (//datarepo01.rz.uni-kiel.de/MDS_DATA/HPC_SHARE/tha, data/DATA_LOCATIONS.md),
# bound under data_root() as paper-data/ (a link or a copy; its README.md, MANIFEST.tsv and MD5SUMS at its root): every rc_raw_photos
# input is a path paper-data/<experiment>/<lens>/<session>, and a config's subset of a folder is stated beside it (`frames` | `exclude`,
# src/drivers.jl INPUT_SELECTION_KEYS). The decoded chrome photographs (chrome/*.photos) are derived inputs, tier rc_baselines.
#
# THE DERIVED TIERS go to the same folder of the share, as plain files in the data root's layout under derived/ — rc_baselines since
# 2026-11-10 (derived/rc_baselines_2026-11-10/, with MANIFEST.tsv, MD5SUMS and a README; the front ends that made it are frozen in
# experiments/frontends/), the others after the final run. The tiers packed on 2026-10-29 and bound in ../Artifacts.toml (one dataset
# record `rc`; `host`, `repo` and `revision` below name the private dataset they were kept on, each binding pinned to the commit that
# holds its tarball) are superseded by the share; how the final tiers are bound (a URL per tarball, make_artifacts.jl --record=rc=<…>
# rebinds, a placeholder fetch_data.jl refuses) is decided with the final run.
# =============================================================================

