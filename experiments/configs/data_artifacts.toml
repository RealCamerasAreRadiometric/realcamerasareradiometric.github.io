# =============================================================================
# [[unpacked.<tier>]] — files that no packed version of the tier holds yet (the catalog's own record of what the tier's NEXT
# version must pack). Not an artifact: VisualGeometryToolkitEval's load_catalog reads only [records] and [artifacts], nothing here
# is bound in Artifacts.toml and fetch_data.jl installs none of it. Each entry: `paths` (data_root()-relative; a directory: every
# file below it), `where` (where the files are today: the share's folder, or the cluster's data root), `provenance`
# (what they are) and `configs` (the configs of record that name each path as an input of that tier; empty for files that no
# config of record reads yet — then no config may name them, and the entry says what they are for). test/data_tests.jl checks
# each entry; where data_root() holds them, scripts/make_artifacts.jl --dry-run counts them apart (in no tier's count, and not
# "in no tier"), the suite compares the tiers' counts without them, and they are exempt from the check that every file of an
# input lies in its tier's packed version. When the tier is repacked (scripts/make_artifacts.jl from a data root that holds
# them: a new entry `<tier>_<yyyymmdd>`, its filter widened where needed, its file count recounted, a new binding) — or packed into
# a tier of their own (as the FX3 + 14 mm capture of 2026-11-02 is, rc_fx3_14mm_20261102, so as not to repack rc_raw_photos) — the
# paths leave this table. A cache directory under data_root() (a CACHEDIR.TAG: the Hugging Face CLI's .cache/huggingface/ of a
# --local-dir download) is the tool's state, not data, and is in no tier and not listed here.
# =============================================================================

# THE SENSOR MODELS (2026-11-14; RC 0.10.0, owner order "use the stack's sensor model"): the cameras' sensor characterisations of record,
# IO's vgio/sensor_characterisation records (Core's SensorCharacterisation), NOT YET A TIER: the next tier to pack is rc_sensor_models_<date>
# (dir sensor_characterisation/, its three files; a new binding in ../Artifacts.toml). Until it is packed each record is an input of
# VisualGeometryToolkitEval's reserved tier "unpublished", pinned by its sha256 in every config that reads it ([inputs.fx3_sensor_characterisation]:
# radiometric_refinement.toml, radiometric_refinement_vignetting.toml, chrome_evaluation_fx3_tamron_largeaperture.toml,
# chrome_evaluation_fx3_zoom48_f10.toml), kept on dgx01 under the unpublished root (/raid/data/jpr/containers/sensor_characterisation,
# read only) and linked into the data root as sensor_characterisation/ (the refinements' [pipeline] camera.sensor_characterisation names it
# there, data_root()-relative):
#   sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json   sha256 add8fc120b83806d1e70ecf4252a3b0bcf64d9fe007f42886789212f8c155737
#     …gain-exifband-alldarks.iso100.band<k>.dark_{offset,variance}.tiff, k = 1…21   42 rasters, each verified by IO on load
#   the Sony ILME-FX3 (no serial in EXIF) at ISO 100: a Darks (owner 2026-11-14: a Dark per measured exposure) of 21 Darks, one per E1_E2
#   exposure (each burst's master dark, its band the burst's EXIF exposure; the shared channel black the 50 E1 1/8000 s darks', measured), a
#   measured PoissonGaussian (K = 11.32987 ± 0.00433 e⁻/code, photon_transfer on E4; σ_r per colour from E1) and a DefectList of 23,544
#   photosites (defect_onsets over every E1_E2 exposure, EXIF onsets), from the frames of rc_sensor_characterisation_20261113 by Core 0.10.3's
#   estimators. It supersedes sensor_characterisation/fx3.sensor_characterisation.gain-exifband.json (sha256 f78633435f24…, one Dark at
#   1/8000 s), left in place, read by no config.

