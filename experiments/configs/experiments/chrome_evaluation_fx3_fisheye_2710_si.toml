[runs.start_si27fe_spline]
config = "configs/experiments/frontends.toml"
run = "schoeps.fisheye2710_siemens"
path = "camera.json"
stage = "evaluate"
provenance = "T. Schöps's central-generic of the 27.10 fisheye Siemens set (f/32) made by the project's front end (frontends.toml [schoeps.fisheye2710_siemens]: green cells, auto gain, cell 150 → 75 and window 10 → 5 on the green cells); replaces the start of record (owner ruling 2026-11-13; validation 0.51 px gauge median at the record's detections)"

[evaluate]
index = "stage"
target = "target"
optimization_strategy = { type = "triggs", loss = "huber" }   # the rotation-centre refine (src/chrome_evaluation.jl evaluate_grid_models: Estimation's refine_camera_and_poses on RotationCenterViews, the camera held): the Triggs-corrected Huber LM at the efficiency table's Huber constant for d = 2 (Core's efficiency_constant(HuberShape, 2)) × the index stage's pooled noise scale (a refine estimates none)
iterations = 80
profile_bins = 10
lens_coverage = "image_region:fx3_fisheye_siemens_20261027"   # the session's measured image region: the radial profile about its centre out to its rim
centre_rho = 0.4                # the summary's centre region: ρ = |𝐩 − centre| / rmax below 0.4 (the regions of record)
edge_rho = 0.6                  # the summary's edge region: ρ above 0.6
holdout = "on"                  # the parity-interleaved hold-out (motion_heldout, the paper's headline; owner 2026-11-15): each fit on one parity of the grid nodes, scoring the other
bootstrap = { resamples = 10000, seed = 20261115, alpha = 0.05 }   # the paired photograph bootstrap of the comparisons (src/chrome_evaluation.jl paired_differences, Eval's bootstrap_ci): 10,000 draws (the owner's count, 2026-11-15: the 2.5 % / 97.5 % tails each rest on 250 draws), StableRNG of the date of the ruling, the 95 % interval
# every refinement against its start (its label with _start for _refined) and every model against the Schöps baseline of its target (T. Schöps's own camera; the label's prefix): model − reference
comparisons = [
    {model = "si27fe_bc5_refined", reference = "si27fe_bc5_start"},
    {model = "si27fe_ds_refined", reference = "si27fe_ds_start"},
    {model = "si27fe_kb_refined", reference = "si27fe_kb_start"},
    {model = "si27fe_ocv14_refined", reference = "si27fe_ocv14_start"},
    {model = "si27fe_spline_refined", reference = "si27fe_spline_start"},
    {model = "si27fe_bc5_start", reference = "si27fe_spline_start"},
    {model = "si27fe_bc5_refined", reference = "si27fe_spline_start"},
    {model = "si27fe_ds_start", reference = "si27fe_spline_start"},
    {model = "si27fe_ds_refined", reference = "si27fe_spline_start"},
    {model = "si27fe_kb_start", reference = "si27fe_spline_start"},
    {model = "si27fe_kb_refined", reference = "si27fe_spline_start"},
    {model = "si27fe_ocv14_start", reference = "si27fe_spline_start"},
    {model = "si27fe_ocv14_refined", reference = "si27fe_spline_start"},
]
max_unassigned = 13                # the fisheye 27.10, as the Tamron: 44 → 64 of 116 photographs (276–288 of 289 assigned)
models = [
    {label = "si27fe_bc5_start", kind = "lens", input = "start_si27fe_bc5"},
    {label = "si27fe_bc5_refined", kind = "lens", case = "si27fe_bc5_warped"},
    {label = "si27fe_ds_start", kind = "lens", input = "start_si27fe_ds"},
    {label = "si27fe_ds_refined", kind = "lens", case = "si27fe_ds_warped"},
    {label = "si27fe_kb_start", kind = "lens", input = "start_si27fe_kb"},
    {label = "si27fe_kb_refined", kind = "lens", case = "si27fe_kb_warped"},
    {label = "si27fe_ocv14_start", kind = "lens", input = "start_si27fe_ocv14"},
    {label = "si27fe_ocv14_refined", kind = "lens", case = "si27fe_ocv14_warped"},
    {label = "si27fe_spline_start", kind = "schoeps", input = "start_si27fe_spline"},   # the Schöps baseline: T. Schöps's OWN camera (his run's camera record), never a grid re-estimated from it (src/chrome_evaluation.jl check_schoeps_baseline)
    {label = "si27fe_spline_refined", kind = "grid", case = "si27fe_spline_warped"},
]

