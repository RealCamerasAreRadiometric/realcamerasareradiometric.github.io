stage = "evaluate"
provenance = "the start of case si27fe_kb_warped (configs/experiments/radiometric_refinement.toml): OpenCV's own calibration of the model on Schöps's star detections (opencv_calibrate_schoeps.py, fe_si7.sh)"

[inputs.start_si27fe_ocv14]
