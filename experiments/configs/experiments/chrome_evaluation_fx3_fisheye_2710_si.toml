[index]
target = "target"
camera = "camera"
camera_name = "cam"
target_id = "thorlabs_r3l3s7n1"
label = "circular"
scoring = { type = "msac" }        # RANSAC's scorer (the stack's SCORING_TAGS): MSAC on the board-plane residual (mm) of the Hungarian's one-to-one matches; its threshold is NOT stated here — it is half the target record's pitch (2.5 mm at 5 mm), the assignment's dustbin, derived in code (owner 2026-11-14)
seed_tolerance = 5.0
rng_seed = 1
min_assigned = 145

[index.ransac]
success_prob = 0.999               # the chrome configs' value of record since their renames (2026-11-12), above Estimation's default 0.99 (configs/default.toml [ransac])
max_trials = 10000                 # Estimation's default (configs/default.toml [ransac]): the cap, never reached (after4: every photograph stopped at min_trials)
min_trials = 200                   # owner 2026-11-14: twice the 100 that every photograph of after4 stopped at (the confidence rule is met far earlier — the grid sampler's draws are correct at the right parity), as margin

# RANSAC's local optimization (src/chrome_evaluation.jl register_grid; owner 2026-11-14): Estimation's Irls strategy at the Gaussian
# shape — plain least squares, not robust: the scorer's matches of the hypothesis are within its threshold by construction — on
# those matches, frozen (the GridPoseProblem's refine!: the board-plane residuals, mm, by Core's chart LM; the Hungarian is not
# re-run), at most max_iter iterations.
[index.local_optimization_strategy]
type = "irls"
loss = "gaussian"                 # plain least squares (the Gaussian shape: no width); its posterior iteration weighs the consensus set alone from Estimation 0.11.2
max_iter = 10

# The photograph's pixel refine after RANSAC (register_grid): Estimation's refine_absolute_pose through the camera on the final
# Hungarian's matches, plain least squares (owner 2026-11-14: no robust loss in the index). The MAD scale of its pixel residuals
# is recorded as the photograph's, pooled per set by the evaluate stage (its Huber width).
[index.refine_strategy]
type = "none"                     # a refine's least squares (optimization_strategy = nothing)

[index.excluded]

