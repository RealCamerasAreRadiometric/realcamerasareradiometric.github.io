# Config of record of the chrome-board evaluation of the chrome set fisheye_2710_si (scripts/chrome_evaluation.jl): ONE config per chrome set,
# every model scored on it a row of [evaluate] models (10 rows). Merged 2026-11-12 (RC 0.9 round 3) from the
# 5 per-model configs chrome_evaluation_fx3_fisheye_2710_si[_<model>].toml, which differed only in their models row and its start input:
# detect, index and the [evaluate] settings were the same in every one (src/chrome_evaluation.jl; test/chrome_evaluation_tests.jl).
#
# The set: the chrome-board evaluation of the FX3 + fisheye chrome photographs (fisheye_20261027; scripts/chrome_evaluation.jl):
# Förstner detection of the 289 backlit dots of the Thorlabs R3L3S7N1 target, their registration against the target's grid (RANSAC
# through the camera of record), and the evaluation of the refinement cases of configs/experiments/radiometric_refinement.toml (one
# rotation centre for the set, from the poses of the index stage's RANSAC local optimization). The settings: each dot's own integration scale selected by SFOP (detect_sfop, then the seeded detect_foerstner).
# the 27.10 fisheye Siemens set (f/32): chrome_evaluation_fx3_fisheye_20261027.toml with case si27fe_bc5_warped and its
# start: the same chrome photographs, detection and index.

[experiment]
name = "chrome_evaluation"

[upstream]
radiometric_refinement = "configs/experiments/radiometric_refinement.toml"

[inputs.fx3_sensor_characterisation]
tier = "unpublished"
path = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"
sha256 = "add8fc120b83806d1e70ecf4252a3b0bcf64d9fe007f42886789212f8c155737"   # sha256sum of the record of record (the B200 server, 2026-11-14)
stage = "detect"
provenance = "the Sony ILME-FX3's sensor characterisation at ISO 100 (vgio/sensor_characterisation/v2.0, VisualGeometryToolkitIO 0.10.2), made on the B200 server 2026-11-14 from the tier rc_sensor_characterisation_20261113 with Core 0.10.3's estimators (scratch e4_alldarks_one.jl + e4_record_alldarks.jl; the experiments' sensor_characterisation experiment reproduces it): black = a Darks of 21 Darks, one per E1_E2 exposure (each burst's master dark, its exposure band the darks' EXIF exposure), their shared channel black the 50 E1 1/8000 s frames' (measured, 512.29/512.23/512.31/512.24 codes); noise = a measured Poisson–Gaussian law (gain K = 11.32987 ± 0.00433 e⁻/code from photon_transfer on the E4 frames, σ_r per colour from E1), defects = 23,544 photosites by defect_onsets over every E1_E2 exposure (EXIF onsets); its 42 rasters fx3.sensor_characterisation.gain-exifband-alldarks.iso100.band<k>.dark_{offset,variance}.tiff beside it, verified by IO on load; supersedes fx3.sensor_characterisation.gain-exifband.json (owner 2026-11-14: a Dark per measured exposure); kept on the B200 server under the unpublished root and linked into the data root (next tier to pack: rc_sensor_models, data_artifacts.toml)"

[inputs.raw]
tier = "rc_raw_photos"
path = "paper-data/geometric-accuracy/fisheye/chrome-siemens"
stage = "prepare"
provenance = "the 118 chrome photographs of the FX3 + Sigma 8 mm fisheye of 27.10.26 (Hugging Face 27.10.26/fisheye/chrome): the RAW photographs (.ARW) the retired decoded copies (rc_baselines chrome/*.photos, decoded by scripts/py/convert_raw.py) were made from (owner 2026-11-14: every chrome set read from its RAW through Features' raw module); on the cluster only"

[inputs.raw_fisheye_siemens_20261027]
tier = "rc_raw_photos"
path = "paper-data/geometric-accuracy/fisheye/siemens-stars"
stage = "evaluate"
provenance = "the 150 Siemens-star photographs of the fisheye at f/32 of 2026-10-27, the chrome photographs' capture session: the session's coverage frames ([image_regions.fx3_fisheye_siemens_20261027])"

# The chrome set's lens coverage (src/image_region.jl; owner ruling 2026-11-15): the session's, measured on five of its Siemens frames
# at the same f/32 (DSC03644 … DSC03764, the frames of 2026-11-08, as RAW). The set is excluded (configs/excluded.toml).
[image_regions.fx3_fisheye_siemens_20261027]
input = "raw_fisheye_siemens_20261027"
frames = { "DSC03644.ARW" = "35930d6e16464ad38aa387014ce31fe7ea63a682e0fa645dd7ddda994ab99f2e", "DSC03674.ARW" = "2a2ecf999c877c7200cbe5af127f675372d2c6297046cecef06645aa6d670806", "DSC03704.ARW" = "5fbf9e9a44286c76c4cd006141041211282c73b0c2d922adc4d7dd54901b1f5b", "DSC03734.ARW" = "5a7bf926fb345d534d07779fb8d19e156138f871afbfeae40615ab54e5e4c3aa", "DSC03764.ARW" = "812758742ebcecdef4b922b3679151cd2e422774fc79741ad6ed963d12f31a39" }   # sha256sum on the B200 server (2026-11-15)
image = "raw_green"           # the geometry image (owner 2026-11-16): the bilinear green on the raw grid at full resolution, the chrome detect's image
outlier_halfwidth_px = 1000.0  # raw px: the owner's 1000 px (ruling 2026-11-12, chosen on full-resolution frames: every set single-basin for 750–2000, the B200 server rc-image-circle-halfwidth.md §9), measured on the raw grid as chosen (before 2026-11-16: 500 green-cell px)
seed = 1                       # the RANSAC ellipse fit's StableRNG seed (the refinements' masks.seed)

[inputs.target]
tier = "rc_thorlabs"
path = "geometric_accuracy/data/target/thorlabs_r3l3s7n1/target.json"
sha256 = "9fd2754a2aa7e278a18d95df15e07140b87bc115dec47be169adebe085fab880"   # sha256sum of the file of record (the local data root and the B200 server's rc-vgtk-root agree, 2026-11-12)
stage = "index"
provenance = "scripts/make_targets.jl from configs/targets/thorlabs_r3l3s7n1.toml (the maker's drawing R3L3S7N1, 15 Nov 2024): 17 x 17 dots at 5.000 mm, calibration Rigid (vgio/target/v3 by vgio_migrate_tree)"

[inputs.camera]
tier = "rc_baselines"
path = "geometric_accuracy/records/2710/fisheye_kb_fit.json"
stage = "index"
provenance = "the 27.10 Kannala–Brandt lens fitted to Schöps's fisheye Siemens detections (fit_lens_detections.jl, branch paper-finalization; vgio/cameras/v4 by vgio_migrate_tree)"

[prepare.fx3_fisheye2710_chrome]
raw = "raw"
mode = "photosites"               # read, not decoded: the RAW photographs linked with their EXIF (Features' load_raw_metadata); detect reads each mosaic

[detect]
sensor_characterisation = "fx3_sensor_characterisation"   # the FX3's record of record (input fx3_sensor_characterisation): each RAW re-linearised under its frame's model, its Poisson–Gaussian noise propagated into the detections' covariances
photos = "fx3_fisheye2710_chrome"
image = "raw_green"               # the RAW mosaics behind prepare's set, Features' bilinear green on the raw grid under each frame's sensor model; raw pixels
precision = "Float32"
device = "gpu"                   # detect_foerstner on the GPU (KernelAbstractions; device 0 of the job)
derivative = "gaussian2d"
derivative_sigma = 2.0                # raw px: 1.0 green cell (the value of record on the green cells until RC 0.10.2) × 2 raw px per cell
polarity = "light"                # the backlit dots are bright on the dark chrome: Features' polarity gate keeps light blobs only, a dark blob (a gap, a shadow) never seeds (owner 2026-11-14)
precision_threshold = 1.0             # raw px: SFOP's point σ gate, 0.5 green cell (the value of record until RC 0.10.2) × 2 raw px per cell
significance_level = 0.999

