# Config of record of the chrome-board evaluation of the chrome set 14mm_central30cm (scripts/chrome_evaluation.jl): ONE config per chrome set,
# every model scored on it a row of [evaluate] models (21 rows). Merged 2026-11-12 (RC 0.9 round 3) from the
# 11 per-model configs chrome_evaluation_fx3_14mm_central30cm[_<model>].toml, which differed only in their models row and its start input:
# detect, index and the [evaluate] settings were the same in every one (src/chrome_evaluation.jl; test/chrome_evaluation_tests.jl).
#
# The set: the chrome-board evaluation of the FX3 + 14mm chrome photographs (14mm_central30cm; scripts/chrome_evaluation.jl):
# Förstner detection of the 289 backlit dots of the Thorlabs R3L3S7N1 target, their registration against the target's grid (RANSAC
# through the index camera: Estimation's Kannala–Brandt fit, frontends.toml [fits.central30cm_14mm_kb]), and the evaluation of the refinement cases of configs/experiments/radiometric_refinement.toml (one
# rotation centre for the set, from the poses of the index stage's RANSAC local optimization). The settings: each dot's own integration scale selected by SFOP (detect_sfop, then the seeded detect_foerstner).

[experiment]
name = "chrome_evaluation"

[upstream]
radiometric_refinement = "configs/experiments/radiometric_refinement.toml"

[inputs.fx3_sensor_characterisation]
tier = "unpublished"
path = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"
sha256 = "add8fc120b83806d1e70ecf4252a3b0bcf64d9fe007f42886789212f8c155737"   # sha256sum of the record of record (the B200 server, 2026-11-14)
stage = "detect"
provenance = "the Sony ILME-FX3's sensor characterisation at ISO 100 (vgio/sensor_characterisation/v2.0, VisualGeometryToolkitIO 0.10.2), made on the B200 server 2026-11-14 from the tier rc_sensor_characterisation_20261113 with Core 0.10.3's estimators (scratch e4_alldarks_one.jl + e4_record_alldarks.jl; the experiments' sensor_characterisation experiment reproduces it): black = a Darks of 21 Darks, one per E1_E2 exposure (each burst's master dark, its exposure band the darks' EXIF exposure), their shared channel black the 50 E1 1/8000 s frames' (measured, 512.29/512.23/512.31/512.24 codes); noise = a measured Poisson–Gaussian law (gain K = 11.32987 ± 0.00433 e⁻/code from photon_transfer on the E4 frames, σ_r per colour from E1), defects = 23,544 photosites by defect_onsets over every E1_E2 exposure (EXIF onsets); its 42 rasters fx3.sensor_characterisation.gain-exifband-alldarks.iso100.band<k>.dark_{offset,variance}.tiff beside it, verified by IO on load; supersedes fx3.sensor_characterisation.gain-exifband.json (owner 2026-11-14: a Dark per measured exposure); kept on the B200 server under the unpublished root and linked into the data root (next tier to pack: rc_sensor_models, data_artifacts.toml)"

