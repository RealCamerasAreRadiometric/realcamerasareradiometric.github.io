[index]
target = "target"
camera = "camera"
camera_name = "cam"
target_id = "thorlabs_r3l3s7n1"
label = "circular"
scoring = { type = "msac" }        # RANSAC's scorer (the stack's SCORING_TAGS): MSAC on the board-plane residual (mm) of the Hungarian's one-to-one matches; its threshold is NOT stated here — it is half the target record's pitch (2.5 mm at 5 mm), the assignment's dustbin, derived in code (owner 2026-11-14)
seed_tolerance = 5.0
rng_seed = 1
min_assigned = 145

[index.ransac]
success_prob = 0.999               # the chrome configs' value of record since their renames (2026-11-12), above Estimation's default 0.99 (configs/default.toml [ransac])
max_trials = 10000                 # Estimation's default (configs/default.toml [ransac]): the cap, never reached (after4: every photograph stopped at min_trials)
min_trials = 200                   # owner 2026-11-14: twice the 100 that every photograph of after4 stopped at (the confidence rule is met far earlier — the grid sampler's draws are correct at the right parity), as margin

# RANSAC's local optimization (src/chrome_evaluation.jl register_grid; owner 2026-11-14): Estimation's Irls strategy at the Gaussian
# shape — plain least squares, not robust: the scorer's matches of the hypothesis are within its threshold by construction — on
# those matches, frozen (the GridPoseProblem's refine!: the board-plane residuals, mm, by Core's chart LM; the Hungarian is not
# re-run), at most max_iter iterations.
[index.local_optimization_strategy]
type = "irls"
loss = "gaussian"                 # plain least squares (the Gaussian shape: no width); its posterior iteration weighs the consensus set alone from Estimation 0.11.2
max_iter = 10

# The photograph's pixel refine after RANSAC (register_grid): Core's LevenbergMarquardt on Estimation's AbsolutePoseProblem through the camera on the final
# Hungarian's matches, plain least squares (owner 2026-11-14: no robust loss in the index). The MAD scale of its pixel residuals
# is recorded as the photograph's, pooled per set by the evaluate stage (its Huber width).
[index.refine_strategy]
type = "none"                     # a refine's least squares (optimization_strategy = nothing)

[index.excluded]

[inputs.start_ag08ta_bc5]
tier = "rc_baselines"
path = "geometric_accuracy/records/tamron20261108_ag_all/tamron20261108_ag_all_green_bc5_cv2.json"
stage = "evaluate"
provenance = "the start of case ag08ta_bc5_warped (configs/experiments/radiometric_refinement.toml): a camera record (vgio/cameras/v4): OpenCV's cv2.calibrateCamera, its default five coefficients (k1 k2 p1 p2 k3), on the ArucoDetector corners of the green copies of all 411 photographs of the Tamron AprilGrid set of 2026-11-08 (the front-end chain fe_ag.sh → ocv_record.jl)"

[inputs.start_ag08ta_ds]
tier = "rc_baselines"
path = "geometric_accuracy/records/tamron20261108_ag_all/tamron20261108_ag_all_green_ds_kalibr.json"
stage = "evaluate"
provenance = "the start of case ag08ta_ds_warped (configs/experiments/radiometric_refinement.toml): a camera record (vgio/cameras/v4): Kalibr's single-camera calibration with its Double Sphere model (ds-none) on 8-bit grey copies of the green linear copies of all 411 photographs of the Tamron AprilGrid set of 2026-11-08 (fe_ds.sh: kalibr_ds.sh → kalibr_record.jl)"

[inputs.start_ag08ta_kb]
tier = "rc_baselines"
path = "geometric_accuracy/records/tamron20261108_ag_all/tamron20261108_ag_all_green_kb_cv2.json"
stage = "evaluate"
provenance = "the start of case ag08ta_kb_warped (configs/experiments/radiometric_refinement.toml): a camera record (vgio/cameras/v4): OpenCV's cv2.fisheye.calibrate (Kannala–Brandt, four coefficients) on the ArucoDetector corners of the green copies of all 411 photographs of the Tamron AprilGrid set of 2026-11-08 (fe_ag.sh → cvfisheye_record.jl)"

[inputs.start_ag08ta_ocv14]
tier = "rc_baselines"
path = "geometric_accuracy/records/tamron20261108_ag_all/tamron20261108_ag_all_green_ocv14_cv2.json"
stage = "evaluate"
provenance = "the start of case ag08ta_ocv14_warped (configs/experiments/radiometric_refinement.toml): a camera record (vgio/cameras/v4): OpenCV's cv2.calibrateCamera with CALIB_RATIONAL_MODEL | CALIB_THIN_PRISM_MODEL | CALIB_TILTED_MODEL (14 coefficients) on the ArucoDetector corners of the green copies of all 411 photographs of the Tamron AprilGrid set of 2026-11-08 (fe_ag.sh → ocv_record.jl)"

[inputs.start_ag08ta_spline]
tier = "rc_baselines"
path = "geometric_accuracy/night_stars/data/fx3-tamron-aprilgrid-20261108-all/schoeps_dense_green"
stage = "evaluate"
provenance = "the start of case ag08ta_spline_warped: T. Schöps's central-generic (configs/experiments/radiometric_refinement.toml)"

[evaluate]
index = "stage"
target = "target"
optimization_strategy = { type = "triggs", loss = "huber" }   # the rotation-centre refine (src/chrome_evaluation.jl evaluate_grid_models: Core's LevenbergMarquardt on Estimation's CameraPosesProblem of RotationCenterViews, the camera held): the Triggs-corrected Huber LM at the efficiency table's Huber constant for d = 2 (Core's efficiency_constant(HuberShape, 2)) × the index stage's pooled noise scale (a refine estimates none)
iterations = 80
profile_bins = 10
lens_coverage = "sensor"        # the chrome set's lens lights the whole sensor (src/image_region.jl): the radial profile about the sensor's centre out to its half-diagonal (2128, 1424; 2560.5 px as stated before 2026-11-15)
centre_rho = 0.4                # the summary's centre region: ρ = |𝐩 − centre| / rmax below 0.4 (the regions of record)
edge_rho = 0.6                  # the summary's edge region: ρ above 0.6
holdout = "on"                  # the parity-interleaved hold-out (motion_heldout, the paper's headline; owner 2026-11-15): each fit on one parity of the grid nodes, scoring the other
bootstrap = { resamples = 10000, seed = 20261115, alpha = 0.05 }   # the paired photograph bootstrap of the comparisons (src/chrome_evaluation.jl paired_differences, Eval's bootstrap_ci): 10,000 draws (the owner's count, 2026-11-15: the 2.5 % / 97.5 % tails each rest on 250 draws), StableRNG of the date of the ruling, the 95 % interval
# every refinement against its start (its label with _start for _refined) and every model against the Schöps baseline of its target (T. Schöps's own camera; the label's prefix): model − reference
comparisons = [
    {model = "ag08ta_bc5_refined", reference = "ag08ta_bc5_start"},
    {model = "ag08ta_ds_refined", reference = "ag08ta_ds_start"},
    {model = "ag08ta_kb_refined", reference = "ag08ta_kb_start"},
    {model = "ag08ta_ocv14_refined", reference = "ag08ta_ocv14_start"},
    {model = "ag08ta_spline_refined", reference = "ag08ta_spline_start"},
    {model = "ag08ta_bc5_start", reference = "ag08ta_spline_start"},
    {model = "ag08ta_bc5_refined", reference = "ag08ta_spline_start"},
    {model = "ag08ta_ds_start", reference = "ag08ta_spline_start"},
    {model = "ag08ta_ds_refined", reference = "ag08ta_spline_start"},
    {model = "ag08ta_kb_start", reference = "ag08ta_spline_start"},
    {model = "ag08ta_kb_refined", reference = "ag08ta_spline_start"},
    {model = "ag08ta_ocv14_start", reference = "ag08ta_spline_start"},
    {model = "ag08ta_ocv14_refined", reference = "ag08ta_spline_start"},
]
max_unassigned = 8                # every photograph of the set registers 283–286 of the 289 dots (3–6 rim / logo dots off); < 17, the grid's shorter side
models = [
    {label = "ag08ta_bc5_start", kind = "lens", input = "start_ag08ta_bc5"},
    {label = "ag08ta_bc5_refined", kind = "lens", case = "ag08ta_bc5_warped"},
    {label = "ag08ta_ds_start", kind = "lens", input = "start_ag08ta_ds"},
    {label = "ag08ta_ds_refined", kind = "lens", case = "ag08ta_ds_warped"},
    {label = "ag08ta_kb_start", kind = "lens", input = "start_ag08ta_kb"},
    {label = "ag08ta_kb_refined", kind = "lens", case = "ag08ta_kb_warped"},
    {label = "ag08ta_ocv14_start", kind = "lens", input = "start_ag08ta_ocv14"},
    {label = "ag08ta_ocv14_refined", kind = "lens", case = "ag08ta_ocv14_warped"},
    {label = "ag08ta_spline_start", kind = "schoeps", input = "start_ag08ta_spline"},   # the Schöps baseline: T. Schöps's OWN camera (his run's camera record), never a grid re-estimated from it (src/chrome_evaluation.jl check_schoeps_baseline)
    {label = "ag08ta_spline_refined", kind = "grid", case = "ag08ta_spline_warped"},
]
