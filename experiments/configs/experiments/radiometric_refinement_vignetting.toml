# the Sigma 14 mm F2.8 at f/4: Schöps's central-generic grid refined with the poses, focus, aperture, material, board warping (from flat),
# the radial V and the lighting; the printed edge fixed (σ_print 0.0277 mm, no camera σ).
[cases.f4_14mm_spline_warped]
kind = "grid"
images = "fx3_14mm_siemens_20261028"
views = "fx3_14mm_siemens_20261028_f4"
[cases.f4_14mm_spline_warped.pipeline.io]
checkpoint_each = "on"
linearize = "off"
channel = "G"                      # the green photosites: one measurement each, one channel (photosites; was "RGB", which counted each three times)
[cases.f4_14mm_spline_warped.pipeline.frontend]
type = "schoeps"
schoeps = "run:fx3_14mm_siemens_20261028_schoeps"
texture = "geometric_accuracy/data/target/siemens_1m/board/texture.png"
texture_features = "geometric_accuracy/data/target/siemens_1m/board/texture_features.bin"
texture_features_size = [4000, 4000]
page_mm = [1000.0, 1000.0]
print_scale = 1.0
[cases.f4_14mm_spline_warped.pipeline.camera]
sensor_mm = 35.6
f_mm = 14.6776
fnumber = 4.0
lens_coverage = "image_region:fx3_14mm_f4_20261028"   # the housing cuts the light inside the sensor: the session's measured image region ([image_regions])
sensor_characterisation = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"   # the FX3's record of record (input fx3_sensor_characterisation): every frame of the set resolves at ISO 100 to the Dark of its exposure where the campaign measured it (Matched), else the shared measured channel black (DarkOutOfBand), with the Poisson–Gaussian noise and defects; its gain whitens the residuals (the weighting follows the model)
[cases.f4_14mm_spline_warped.pipeline.grid]
lattice = "derived"             # T. Schöps's own lattice extended over the lens coverage, never subdivided (m = 1; owner ruling 2026-11-15: his
                                #   cell runs the 14 mm refinement at 88 s/it against ≈ 300 s at the 40 px subdivision, rel-RMS equal to 3 digits)
nodes = "interior"
[cases.f4_14mm_spline_warped.pipeline.grid.smoothness]
type = "pspline"
order = 3                         # the third differences Δ³ of the grid correction (the grid A/B's winner)
weight = 0.1
[cases.f4_14mm_spline_warped.pipeline.masks]
gradient_bias = 0.0          # α = 0, the uniform draw (owner 2026-11-16, the sampling-strategy record rc-results-0.11/sampling_strategy/record/952231f4538a4b78, uniform best on both cases and metrics: the 14 mm a1 − uniform texture at 1 mm +0.0099 [+0.0092, +0.0106], Thorlabs median +0.0046 [+0.0000, +0.0097]; the fisheye n.s. on the median, +0.040 px at p95)
seed = 1
[cases.f4_14mm_spline_warped.pipeline.rendering]
N = 16
n_p = 2
hammersley = "on"
n_rho = 3
n_phi = 8
[cases.f4_14mm_spline_warped.pipeline.lighting]
sh_order = 2
[cases.f4_14mm_spline_warped.pipeline.material]
alpha_ink = 0.6
alpha_noink = 0.6
eta_ink = 2.0
eta_noink = 1.3
mu = 0.244
mu_bounds = [0.0, 1.0]
[cases.f4_14mm_spline_warped.pipeline.vignetting]
model = "radial"
node_count = 19   # the projective chart's 19: 16 functions on the fitted pixels, as the linear 16 (T. Harder; Core 0.10.11)
degree = 3
