# Config of record of the paper's large-aperture refinements (scripts/radiometric_refinement.jl with --config=<this>): per lens the Schöps
# central-generic start refined radiometrically on the 28.10.26 Siemens-star photographs taken at a LARGE aperture (f/4; the Tamron f/2.8)
# for strong vignetting; fig:focus-surfaces reads the fisheye's camera (configs/experiments/focus_surfaces.toml).
#
# The grid: 35 × 25 controls, the nodes outside the imaged region dependent.
#
# [vignetting] boundary_order = 2 named in every case — RadiometricCamera 0.7.0 continues the radial profile's dependent control
# points (below support_min of the data weight) with Core's BoundaryRule, the natural Δ²c = 0 (held constant before: the plateaus at
# the ends of fig:vignetting's diagonals); the option names the rule the runs are keyed by.
#
# Paths are relative to data_root() (VGTK_DATA_ROOT). Raw photographs: Hugging Face radiometric-camera/radiometric-camera-data
# 28.10.26/<lens>/SiemensStars.

[experiment]
name = "radiometric_refinement"

[kinds]
source = "configs/experiments/radiometric_refinement.toml"   # the samples per view of every spline case (owner 2026-11-16 23:30), stated there once

[material_grid]
source = "configs/experiments/radiometric_refinement.toml"   # the grid every case's material start is searched on (stage material_grid), stated there once


[runs.siemens_1m_distance_map]
config = "configs/experiments/distance_maps.toml"
run = "maps.siemens_1m"
path = "distance_map.json"
stage = "refine"
provenance = "the 1 m Siemens-star print's printed-edge distance map, a vgio/raster record (edge.sdf): the step [maps.siemens_1m] of distance_maps.toml (scripts/distance_maps.jl), keyed by the board generator's sdf.f32 + sdf.json (each pinned by its sha256), produced on demand when missing (owner 2026-11-16: a derived file is produced, never an input of record)"

[inputs.fx3_sensor_characterisation]
tier = "unpublished"
path = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"
sha256 = "add8fc120b83806d1e70ecf4252a3b0bcf64d9fe007f42886789212f8c155737"   # sha256sum of the record of record (dgx01, 2026-11-14)
stage = "refine"
provenance = "the Sony ILME-FX3's sensor characterisation at ISO 100 (vgio/sensor_characterisation/v2.0, VisualGeometryToolkitIO 0.10.2), made on dgx01 2026-11-14 from the tier rc_sensor_characterisation_20261113 with Core 0.10.3's estimators (scratch e4_alldarks_one.jl + e4_record_alldarks.jl; the experiments' sensor_characterisation experiment reproduces it): black = a Darks of 21 Darks, one per E1_E2 exposure (each burst's master dark, its exposure band the darks' EXIF exposure), their shared channel black the 50 E1 1/8000 s frames' (measured, 512.29/512.23/512.31/512.24 codes); noise = a measured Poisson–Gaussian law (gain K = 11.32987 ± 0.00433 e⁻/code from photon_transfer on the E4 frames, σ_r per colour from E1), defects = 23,544 photosites by defect_onsets over every E1_E2 exposure (EXIF onsets); its 42 rasters fx3.sensor_characterisation.gain-exifband-alldarks.iso100.band<k>.dark_{offset,variance}.tiff beside it, verified by IO on load; supersedes fx3.sensor_characterisation.gain-exifband.json (owner 2026-11-14: a Dark per measured exposure); kept on dgx01 under the unpublished root and linked into the data root (next tier to pack: rc_sensor_models, data_artifacts.toml)"

[inputs.raw_14mm_siemens_20261028]
tier = "rc_raw_photos"
path = "paper-data/vignetting/14mm/siemens-stars"
stage = "prepare"
provenance = "the Siemens-star photographs (Sony FX3 ARW + HIF) of the 1 m board with the Sigma 14 mm F2.8 at f/4, captured on 2026-10-28; Hugging Face 28.10.26/14mm/SiemensStars"

