# Config of record of the detector-bias experiment (scripts/detector_bias.jl; src/detector_bias.jl): fig:detector-bias (Sec. 5.1,
# Fig. 4). How a feature detector's bias enters a geometric calibration, and what the radiometric refinement leaves of it, measured
# against the truth: the photographs are Mitsuba 3 renders by F. Seegräber with a known camera at known poses (4256 × 2848, 8-bit
# sRGB, 10 000 per set), two sets of them:
#
#   fov_aprilgrid   a 1 m AprilGrid seen by a FOV-model camera (f 2404.14 / 2404.10 px, c the image centre, ω 0.62468 rad). Detector:
#                   OpenCV's AprilGrid corners. Geometric calibration: plain OpenCV, its 14-coefficient model (OpenCV-14)
#   ds_siemens      our 1 m Siemens-star board seen by a Double Sphere fisheye (f 725.90 / 725.30 px, c (2139.74, 1441.50), ξ −0.2206,
#                   α 0.6160). Detector: T. Schöps's star detector. Geometric calibration: his camera_calibration, central-generic
#                   (the spline)
#
# Each case calibrates on 200 of its set's renders: the detector-based calibration is its start, the radiometric refinement (the
# full method: radiometry, focus, aperture, board warping free) refines it, and both are evaluated against the truth — under the
# calibrated poses, and under the true poses with one global rotation removed. The figure shows, per case, one render, the
# detector's bias over all 10 000 renders of the set, and the two evaluations' error fields before and after the refinement.
#
#   julia --project=experiments experiments/scripts/detector_bias.jl [--plan] [--stage=NAME[,NAME]] [--case=a,b] [--force]
#
# The cases' settings are those of the refinements of record (configs/experiments/radiometric_refinement.toml) where the sets
# allow it; what differs is what the sets are: sRGB renders read as they are (io.images, linearize = "on", all three channels),
# no sensor record, the material of the renders, and each case's own start. Paths are relative to data_root() (VGTK_DATA_ROOT).

[experiment]
name = "detector_bias"

# The samples per photograph are those of the refinements of record, stated there once per model kind (src/drivers.jl
# inherit_kinds!): 8,192 for the global model, 16,384 for the spline. No case states them again.
[kinds]
source = "configs/experiments/radiometric_refinement.toml"

# ---- the renders and their truth (tier rc_synthetic) -------------------------------------------------------------------------------
[inputs.renders_fov_aprilgrid]
tier = "rc_synthetic"
path = "paper-data/detector_bias/output_fov_april/images"
stage = "detect"
provenance = "the AprilGrid set: 10 000 Mitsuba 3.9.0 renders (image_0000.png … image_9999.png, 4256 × 2848, 8-bit sRGB) of a 1 m AprilGrid (10 × 10 tags 36h11) at random poses through a FOV-model camera, by F. Seegräber; the case reads the 200 of [views] mitsuba_fov"

[inputs.renders_ds_siemens]
tier = "rc_synthetic"
path = "paper-data/detector_bias/output_ds_siemens/images"
stage = "detect"
provenance = "the Siemens-star set: 10 000 Mitsuba 3.9.0 renders (image_0000.png … image_9999.png, 4256 × 2848, 8-bit sRGB) of the flat 1 m Siemens-star board at random poses through a Double Sphere fisheye, by F. Seegräber; the case reads the 200 of [views] mitsuba_siemens_fisheye"

[inputs.detections_fov_aprilgrid]
tier = "rc_synthetic"
path = "paper-data/detector_bias/output_fov_april/data.npy"
sha256 = "4603e567c6f06fbaba30c3634619ab12b5f587ff5d34b9b32e86389a4d3a5da7"
stage = "figures"
provenance = "the render pipeline's record of the AprilGrid set (NumPy's pickle of a dictionary): per render the corners OpenCV's AprilGrid detector found (detected), their true projections (projected) and their board points, the four corners of every tag; all 10 000 renders"

[inputs.detections_ds_siemens]
tier = "rc_synthetic"
path = "paper-data/detector_bias/output_ds_siemens/data.npy"
sha256 = "6f4d1ee9ec9157c257e18bdf0e94c0d28ac0c839c4b1567cb18574a804bca380"
stage = "figures"
provenance = "the render pipeline's record of the Siemens-star set (NumPy's pickle of a dictionary): per render the star centres T. Schöps's detector found (detected), their true projections (projected) and their board points; all 10 000 renders"

[inputs.truth_fov_aprilgrid]
tier = "rc_synthetic"
path = "geometric_accuracy/detector_bias/data/mitsuba/fov/gt/poses.json"
stage = "detect"
provenance = "the truth of the 200 views of the AprilGrid case: the board's points and per view the true pixels of the detected tags' corners (poses.json), with the true poses beside it (trajectory.json: Mitsuba's camera-to-world matrices in the board's page frame) and the true camera (camera.json); written from the render pipeline's records by the author-side preparation"

[inputs.truth_ds_siemens]
tier = "rc_synthetic"
path = "geometric_accuracy/detector_bias/data/mitsuba/ds_siemens/gt/poses.json"
stage = "detect"
provenance = "the truth of the 200 views of the Siemens-star case: the board's points and per view the true pixels of the detected stars (poses.json), with the true poses beside it (trajectory.json: Mitsuba's camera-to-world matrices in the board's page frame) and the true camera (camera.json); written from the render pipeline's records by the author-side preparation"

[inputs.disc_ds]
tier = "rc_synthetic"
path = "geometric_accuracy/detector_bias/data/mitsuba/ds/circle_rgb"
stage = "detect"
provenance = "the image disc of the Double Sphere renders, a white disc on black (F1.png): the per-pixel maximum of 200 renders of the same camera (the render pipeline's Double Sphere AprilGrid set), made by the author-side preparation"

# ---- the detectors' outputs and the geometric calibrations the cases start from (tier rc_baselines) ----------------------------------
[inputs.corners_fov_aprilgrid]
tier = "rc_baselines"
path = "geometric_accuracy/detector_bias/data/mitsuba/fov/frontend"
stage = "detect"
provenance = "OpenCV's AprilGrid corners of the 200 views (the render pipeline's detections) as the front end's feature file (dataset.bin: feature id = 4 tag + corner), written by the author-side preparation"

[inputs.start_fov_aprilgrid]
tier = "rc_baselines"
path = "geometric_accuracy/detector_bias/data/mitsuba/fov/records/start_opencv.json"
stage = "detect"
provenance = "plain OpenCV's calibration on those corners, a camera record (vgio/cameras): OpenCV-14, cv2.calibrateCamera with CALIB_RATIONAL_MODEL | CALIB_THIN_PRISM_MODEL | CALIB_TILTED_MODEL from OpenCV's own start"

[inputs.schoeps_ds_siemens]
tier = "rc_baselines"
path = "geometric_accuracy/detector_bias/data/mitsuba/ds_siemens/schoeps"
stage = "detect"
provenance = "T. Schöps's camera_calibration, central-generic (cell 150 px, 4 pyramid levels), on the star detections of the 200 views (the render pipeline's features.bin, his detector's): intrinsics0.yaml, the poses and the pruned dataset.bin"

# ---- the boards (tier rc_calibration) -----------------------------------------------------------------------------------------------
[inputs.aprilgrid_mitsuba_board]
tier = "rc_calibration"
path = "geometric_accuracy/data/target/aprilgrid_mitsuba_exact/board"
stage = "detect"
provenance = "the renders' AprilGrid as a board: 10 × 10 tags 36h11 (ids 0–99, 2-bit border), tag 80.01 mm, spacing 18.203333 mm, on a page of 1016.3476 mm; its design is the render pipeline's own texture (11815 px at 300 dpi): texture.png (the paper coverage of every texel), texture_features.bin (the 400 tag corners) and board.json, written by the author-side preparation"

[inputs.siemens_1m_board]
tier = "rc_calibration"
path = "geometric_accuracy/data/target/siemens_1m/board"
stage = "detect"
provenance = "the 1 m Siemens-star print, the board of the refinements of record: texture, texture features, board record"

[inputs.aprilgrid_mitsuba_distance_map]
tier = "rc_calibration"
path = "geometric_accuracy/data/target/aprilgrid_mitsuba_exact/distance_map_10ppm"
stage = "detect"
provenance = "the printed-edge distance map of the renders' AprilGrid (10 px per mm), a vgio/raster record (distance_map.json + distance_map.tiff): the distances from the render pipeline's own texture, exact at its texel centres and read bilinearly on this raster; an input of record, written once by the author-side preparation"

# The Siemens-star print's printed-edge distance map: a keyed step of configs/experiments/distance_maps.toml, produced on demand.
[runs.siemens_1m_distance_map]
config = "configs/experiments/distance_maps.toml"
run = "maps.siemens_1m"
path = "distance_map.json"
stage = "refine"
provenance = "the 1 m Siemens-star print's printed-edge distance map, a vgio/raster record (edge.sdf): the step [maps.siemens_1m] of distance_maps.toml, keyed by the board generator's sdf.f32 + sdf.json (each pinned by its sha256), produced on demand when missing"

# The lens coverage of the Double Sphere renders (src/image_region.jl): their image disc lies inside the frame, measured on the
# disc's frame. The FOV renders fill the frame ("sensor").
[image_regions.mitsuba_fisheye_disc]
input = "disc_ds"
frames = { "F1.png" = "26d4e2a13ef43ee072798d5845f7b076ca5761368e34bf0622e7d31cfdc91dea" }
image = "luma"                 # a decoded image: its Rec. 709 luma on the pixel grid (a render has no raw grid)
outlier_halfwidth_px = 1000.0  # as the capture sets' regions of record (px)
seed = 1                       # the RANSAC ellipse fit's StableRNG seed, as the capture sets'

