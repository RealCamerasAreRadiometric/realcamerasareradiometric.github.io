# A case. kind: the model it refines ("lens": a global model, "grid": the spline); views: its renders, a [views] list; truth: the
# [inputs] id of its truth report (poses.json, the true poses beside it); pipeline: its [pipeline] table, run by bin/refine.jl.

# AprilGrid + plain OpenCV (OpenCV-14): the geometric start refined radiometrically
[cases.db_ocv14_mitsuba_fov]
kind = "lens"
views = "mitsuba_fov"
truth = "truth_fov_aprilgrid"
[cases.db_ocv14_mitsuba_fov.pipeline.io]
images = "paper-data/detector_bias/output_fov_april/images"
linearize = "on"               # 8-bit sRGB renders, decoded on loading
channel = "RGB"
checkpoint_each = "on"         # a checkpoint per iteration: the evaluation reads the last one
init = "lens:geometric_accuracy/detector_bias/data/mitsuba/fov/records/start_opencv.json"   # the start: OpenCV's calibration
[cases.db_ocv14_mitsuba_fov.pipeline.frontend]
type = "schoeps"
schoeps = "geometric_accuracy/detector_bias/data/mitsuba/fov/frontend"
texture = "geometric_accuracy/data/target/aprilgrid_mitsuba_exact/board/texture.png"
texture_features = "geometric_accuracy/data/target/aprilgrid_mitsuba_exact/board/texture_features.bin"
texture_features_size = [5081, 5081]
page_mm = [1016.3476115376634, 1016.3476115376634]
print_scale = 1.0
[cases.db_ocv14_mitsuba_fov.pipeline.camera]
sensor_mm = 35.6
f_mm = 20.79                   # the renders' focal length on a 35.6 mm sensor (2485 px)
fnumber = 32.0
lens_coverage = "sensor"       # the renders fill the frame
[cases.db_ocv14_mitsuba_fov.pipeline.masks]
gradient_bias = 0.0            # the uniform draw, as the refinements of record
seed = 1
[cases.db_ocv14_mitsuba_fov.pipeline.rendering]
N = 16
n_p = 2
hammersley = "on"
n_rho = 3
n_phi = 8
[cases.db_ocv14_mitsuba_fov.pipeline.lighting]
sh_order = 2
[cases.db_ocv14_mitsuba_fov.pipeline.material]
alpha_ink = 0.6
alpha_noink = 0.6
eta_ink = 2.7                  # the start of the paper's detector-bias runs (the refinements of record: 2.0)
eta_noink = 1.3
mu = 0.229                     # the start of the paper's detector-bias runs (the refinements of record: 0.244)
mu_bounds = [0.0, 1.0]
[cases.db_ocv14_mitsuba_fov.pipeline.vignetting]
model = "radial"
node_count = 19
degree = 3
support_min = 0.1
[cases.db_ocv14_mitsuba_fov.pipeline.warping]
degree = 1
inplane = "aspect_skew"        # the board's in-plane aspect and skew are estimated,
inplane_start = [0.0, 0.0]     # from the design as it is
[cases.db_ocv14_mitsuba_fov.pipeline.edge]
sdf = "geometric_accuracy/data/target/aprilgrid_mitsuba_exact/distance_map_10ppm/distance_map.json"   # a record of the data root (input aprilgrid_mitsuba_distance_map)
print_sigma_mm = 0.0277
ink_spread_mm = 0.0
[cases.db_ocv14_mitsuba_fov.pipeline.lm]
max_iter = 36                  # the cap of the paper's run, which reached it (the refinements of record: 25)
max_time = 36000.0
[cases.db_ocv14_mitsuba_fov.pipeline.compute]
backend = "gpu"
jacobian_chunk = 4

# Siemens stars + T. Schöps's central-generic calibration (the spline): the geometric start refined radiometrically
[cases.db_spline_mitsuba_siemens_fisheye]
kind = "grid"
views = "mitsuba_siemens_fisheye"
truth = "truth_ds_siemens"
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.io]
images = "paper-data/detector_bias/output_ds_siemens/images"
linearize = "on"               # 8-bit sRGB renders, decoded on loading
channel = "RGB"
checkpoint_each = "on"         # a checkpoint per iteration: the evaluation reads the last one
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.frontend]
type = "schoeps"
schoeps = "geometric_accuracy/detector_bias/data/mitsuba/ds_siemens/schoeps"
texture = "geometric_accuracy/data/target/siemens_1m/board/texture.png"
texture_features = "geometric_accuracy/data/target/siemens_1m/board/texture_features.bin"
texture_features_size = [4000, 4000]
page_mm = [1000.0, 1000.0]
print_scale = 1.0
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.camera]
sensor_mm = 35.6
f_mm = 7.79                    # the renders' focal length on a 35.6 mm sensor (931 px at the centre)
fnumber = 32.0
lens_coverage = "image_region:mitsuba_fisheye_disc"   # the renders' image disc ([image_regions])
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.grid]
lattice = "derived"            # T. Schöps's own lattice extended over the lens coverage, never subdivided, as the spline cases of record
nodes = "interior"
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.grid.smoothness]
type = "pspline"
order = 3
weight = 0.01                  # the paper's figure (the spline cases of record: 0.1)
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.masks]
lens_coverage_scale = 0.9      # the photometric pixels are sampled inside the image disc scaled by 0.9: the paper's figure
gradient_bias = 0.0            # the uniform draw, as the refinements of record
seed = 1
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.rendering]
N = 16
n_p = 2
hammersley = "on"
n_rho = 3
n_phi = 8
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.lighting]
sh_order = 2
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.material]
alpha_ink = 0.6
alpha_noink = 0.6
eta_ink = 2.7                  # the start of the paper's detector-bias runs (the refinements of record: 2.0)
eta_noink = 1.3
mu = 0.229                     # the start of the paper's detector-bias runs (the refinements of record: 0.244)
mu_bounds = [0.0, 1.0]
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.vignetting]
model = "radial"
node_count = 19
degree = 3
support_min = 0.1
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.warping]
degree = 1
inplane = "aspect_skew"        # the board's in-plane aspect and skew are estimated,
inplane_start = [0.0, 0.0]     # from the design as it is
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.edge]
sdf = "run:siemens_1m_distance_map"
print_sigma_mm = 0.0277
ink_spread_mm = 0.0
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.lm]
max_iter = 50                  # the cap of the paper's run, which ended on the cost decrease after 25 iterations (the fisheye refinements of record: 50)
max_time = 36000.0
[cases.db_spline_mitsuba_siemens_fisheye.pipeline.compute]
backend = "gpu"
jacobian_chunk = 4

# The evaluation of a case, at its start and at the last checkpoint of its refinement: every true board point projected with the
# camera under the run's own poses (learned_it<k>.json) and under the true poses (truepose_it<k>.json), minus its true pixel.
[evaluate]
gauge = "on"                   # under the true poses one global rotation of all rays is removed first (the camera frame's gauge: a generic camera has no frame of its own); "off" keeps the camera's frame

# The paper's figure (src/paper_figures/detector_bias.jl): <asset_dir>.tex, its panels and keys in <asset_dir>/, <asset_dir>-caption.tex.
[figure]
asset_dir = "detector-bias-mitsuba"   # plotsdir("detector-bias-mitsuba.tex", "detector-bias-mitsuba/<files>-<panel>.{tex,png,jpg}", "detector-bias-mitsuba-caption.tex"): the paper's fig/ layout
order = ["opencv_aprilgrid", "schoeps_siemens"]   # the rows from the top, each a [figure.<row>] table below
bins = [26, 18]                # the sensor bins of every field, columns × rows (164 px squares of the 4256 × 2848 sensor, nearly)
field_px = [532, 356]          # a field's image: the bin means interpolated bilinearly, on an eighth of the sensor's pixels
render_px = [1064, 712]        # the shown render: the sensor's pixels reduced to a quarter (Lanczos)
render_jpeg_quality = 90       # and stored as a JPEG of this quality
bias_min_features = 100        # a bin of the bias panel is drawn with at least 100 detections
calibration_min_points = 20    # a bin of a calibration panel with at least 20 board points
# A row's table. case: the case whose evaluation its calibration panels show. detections: the [inputs] id of its set's record of
# all detections (stage figures), the bias panel's. render: the view shown in the Render column, one of the case's views. files:
# the name of its files, <asset_dir>/<files>-<panel>.{tex,png} and <files>-render.jpg. detector, target: its name at the left,
# "<detector> + <target>"; model: the camera model, the head of its calibration pairs; camera: the camera of its renders, the
# head of its render (all LaTeX text). features: what its detector finds, "corners" (the tag corners) or "stars" (the star
# centres). key_quantile: the radius of its calibration pairs' keys is this quantile of the pair's bin vectors, rounded up to two
# digits — 1.0: the largest vector; below 1 the longer vectors are drawn at full saturation and the key says so (a band, "≥").
# notes: per panel named, a text set in light grey in its middle.
[figure.opencv_aprilgrid]
case = "db_ocv14_mitsuba_fov"
detections = "detections_fov_aprilgrid"
render = "image_7039.png"
files = "opencv-aprilgrid-ocv14"
detector = "OpenCV"
target = "AprilGrid"
model = "OpenCV-14"
camera = "FOV"
features = "corners"
key_quantile = 1.0
notes = { pose-radiometric = "error not visible", camera-radiometric = "error not visible" }   # the two panels are white at their pairs' keys (the Geometric panels' scale): the refinement leaves an error too small to be seen there
[figure.schoeps_siemens]
case = "db_spline_mitsuba_siemens_fisheye"
detections = "detections_ds_siemens"
render = "image_0270.png"
files = "schops-siemensstars-spline-ds"
detector = 'Sch\"ops'
target = "Siemens stars"
model = "Spline"
camera = "Double Sphere"
features = "stars"
key_quantile = 0.98            # a few rim bins with very large vectors would set the radius and leave the rest pale
notes = {}
