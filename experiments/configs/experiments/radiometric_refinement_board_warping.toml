node_count = 19   # the projective chart's 19: 16 functions on the fitted pixels, as the linear 16 (T. Harder; Core 0.10.11)
degree = 3
support_min = 0.1
[cases.bw_si_tamron_spline_warped.pipeline.warping]
degree = 1
inplane = "aspect_skew"          # # the printed pattern's in-plane aspect and skew are estimated; owner ruling 2026-11-13 (Core's Aspect ∘ Skew in the placed chart; "inplane" not in fixed)
inplane_start = [0.0, 0.0]       # started at the design as printed
[cases.bw_si_tamron_spline_warped.pipeline.edge]
sdf = "run:siemens_1m_distance_map"
print_sigma_mm = 0.0277
ink_spread_mm = 0.0
[cases.bw_si_tamron_spline_warped.pipeline.lm]
max_iter = 25                     # 25, owner 2026-11-14: the 14 mm si30_spline_warped run (Schöps start, photosites + FX3 all-darks) flattened by ~20 iterations (rel-RMS 0.2901 @10, 0.2876 @21, 0.2872 @47); doubling the pixels left the trajectory unchanged to 3–4 digits
max_time = 36000.0
[cases.bw_si_tamron_spline_warped.pipeline.compute]
backend = "gpu"
jacobian_chunk = 4
