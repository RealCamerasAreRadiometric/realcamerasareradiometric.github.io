# Config of record of the board-warping refinements (scripts/radiometric_refinement.jl with --config=<this>; the supplement's board
# warping across lenses, configs/supplement/board_warping_lenses.toml): both printed calibration boards — the 1 m Siemens-star board
# and the 1 m AprilGrid — photographed with the three lenses (the Sigma 14 mm, the 8 mm fisheye, the Tamron 20 mm) in ONE session,
# each board in place for its three sets, and each of the six sets refined with the central spline. The six learned height fields
# are then three estimates of each board's one shape.
#
# Every case is the central-spline case of record of its lens and board (radiometric_refinement.toml: si30, si30fe, si17ta, ag30,
# ag10fe, ag08ta — the board model, the grid, the masks, the rendering, the material start, the vignetting, the LM cap) with its
# photographs, its views, its f-number (f/10, the photographs' EXIF value), its start and, for the fisheye, its lens coverage (the
# set's own image circle) in their place. No chrome board was photographed in the session: no case is scored on one, so the cases
# are no cases of radiometric_refinement.toml (the chrome table's), as the f/4 cases of radiometric_refinement_vignetting.toml are not.
#
# The starts. The Siemens-star sets': the project's front ends (scripts/frontends.jl, configs/experiments/frontends.toml
# [schoeps.bw_<lens>_siemens_w<window>]), read as [runs] by their keys. The AprilGrid sets': initial guesses of another system, inputs
# of record of tier rc_baselines as those of the AprilGrid cases of record (T. Schöps's central-generic on the dense AprilGrid
# dataset of OpenCV's corners, the chain of experiments/frontends_history/ of tag v0.10.0).
#
# The black level. Every photograph of the session is exposed for 0.625 s, an exposure the FX3's sensor characterisation holds no
# Dark for (its 21 Darks: one per exposure of the earlier sets). Each frame therefore resolves to the record's shared measured
# channel black (Core's reason DarkOutOfBand), with the record's Poisson–Gaussian noise and its defects, which are per ISO: what each
# case's camera.sensor_characterisation states for a frame outside the measured exposures.
#
# Paths are relative to data_root() (VGTK_DATA_ROOT). Raw photographs: the share's folder board-warping (data/DATA_LOCATIONS.md).

[experiment]
name = "radiometric_refinement"

[kinds]
source = "configs/experiments/radiometric_refinement.toml"   # the samples per view of every spline case, stated there once

[material_grid]
source = "configs/experiments/radiometric_refinement.toml"   # the grid every case's material start is searched on (stage material_grid), stated there once

[runs.siemens_1m_distance_map]
config = "configs/experiments/distance_maps.toml"
run = "maps.siemens_1m"
path = "distance_map.json"
stage = "refine"
provenance = "the 1 m Siemens-star print's printed-edge distance map, a vgio/raster record (edge.sdf): the step [maps.siemens_1m] of distance_maps.toml (scripts/distance_maps.jl), keyed by the board generator's sdf.f32 + sdf.json (each pinned by its sha256), produced on demand when missing (owner 2026-11-16: a derived file is produced, never an input of record)"

[runs.aprilgrid_distance_map_8ppm]
config = "configs/experiments/distance_maps.toml"
run = "maps.aprilgrid_8ppm"
path = "distance_map.json"
stage = "refine"
provenance = "the AprilGrid's printed-edge distance map (8 px per mm), a vgio/raster record (edge.sdf): the step [maps.aprilgrid_8ppm] of distance_maps.toml (scripts/distance_maps.jl), keyed by the board generator's sdf.f32 + sdf.json (each pinned by its sha256), produced on demand when missing (owner 2026-11-16: a derived file is produced, never an input of record)"

[inputs.fx3_sensor_characterisation]
tier = "unpublished"
path = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"
sha256 = "add8fc120b83806d1e70ecf4252a3b0bcf64d9fe007f42886789212f8c155737"   # sha256sum of the record of record (dgx01, 2026-11-14)
stage = "refine"
provenance = "the Sony ILME-FX3's sensor characterisation at ISO 100 (vgio/sensor_characterisation/v2.0, VisualGeometryToolkitIO 0.10.2), made on dgx01 2026-11-14 from the tier rc_sensor_characterisation_20261113 with Core 0.10.3's estimators (scratch e4_alldarks_one.jl + e4_record_alldarks.jl; the experiments' sensor_characterisation experiment reproduces it): black = a Darks of 21 Darks, one per E1_E2 exposure (each burst's master dark, its exposure band the darks' EXIF exposure), their shared channel black the 50 E1 1/8000 s frames' (measured, 512.29/512.23/512.31/512.24 codes); noise = a measured Poisson–Gaussian law (gain K = 11.32987 ± 0.00433 e⁻/code from photon_transfer on the E4 frames, σ_r per colour from E1), defects = 23,544 photosites by defect_onsets over every E1_E2 exposure (EXIF onsets); its 42 rasters fx3.sensor_characterisation.gain-exifband-alldarks.iso100.band<k>.dark_{offset,variance}.tiff beside it, verified by IO on load; supersedes fx3.sensor_characterisation.gain-exifband.json (owner 2026-11-14: a Dark per measured exposure); kept on dgx01 under the unpublished root and linked into the data root (next tier to pack: rc_sensor_models, data_artifacts.toml)"

[inputs.siemens_1m_board]
tier = "rc_calibration"
path = "geometric_accuracy/data/target/siemens_1m/board"
stage = "refine"
provenance = "the board print: texture, texture features, printed-edge distance map"

[inputs.aprilgrid_board_sdf_8ppm]
