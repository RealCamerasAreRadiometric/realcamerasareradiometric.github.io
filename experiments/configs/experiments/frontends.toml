# Config of record of the geometric front ends (scripts/frontends.jl, src/frontends.jl): the start cameras of the Siemens-star sets
# made by this project, replacing the frozen chains of 2026-11-05 … 09 (experiments/frontends_history/ of tag v0.10.0, the reference for
# the starts of record of tier rc_baselines; the folder left the working tree after that tag, and frontends/ beside the tier on the share
# is the same tree). Per set:
#   [cases.<set>]    the photographs decoded by Features' raw module into the geometry image the case states (image = "raw_green":
#                    the bilinear green on the raw grid at full resolution, each frame under its sensor model) and written as the
#                    tool's 8-bit sRGB images
#   [schoeps.<run>]   T. Schöps's camera_calibration (detection + central-generic) in its pinned container on those images, its run
#                     imported through VisualGeometryToolkitIO onto the raw grid (camera.json, detections.json)
#   [fits.<name>]     an index camera: Estimation's fit of a parametric lens to the imported detections
# Every run is a result (<results>/frontends/<stage>-<key>); the configs that read a start name it in their [runs] table. The tool's arguments are copied verbatim from the frozen drivers, each with its citation
# (frontends_history/drivers/<file>:<line>, a path of that tree: git show v0.10.0:experiments/frontends_history/drivers/<file>), so the
# starts are comparable with those of record; the paths the drivers gave
# (--image_directories, --pattern_files, --dataset_output_path, --output_directory) are the stage's.
#
# The decode differs from the frozen chain by rule (the one RAW path): Features' bilinear green on the raw grid (owner 2026-11-16: ONE
# geometric image for every detector, the chrome detect's image = "raw_green"), not the copies of a demosaic at full size. It is at
# the raw's full resolution (4256 × 2848, frame map the identity), as the frozen chain's copies were, so a tool's pixel-valued argument
# (the cell length, the refinement window) spans the raw pixels it did.
#
# Paths are relative to data_root() (VGTK_DATA_ROOT).

[experiment]
name = "frontends"

