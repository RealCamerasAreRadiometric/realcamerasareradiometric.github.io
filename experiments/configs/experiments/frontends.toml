args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 10"   # window 10, the frozen default verbatim: no Thorlabs pair; the fisheye 30 cm set's tie-breaks applied to this set's own runs — coverage 99.8 % vs 98.9 % of its image circle and 71 vs 58 of 160 localised at 10 vs 30

# rationale (window)
#   question    which refinement window gives the Tamron f/2.8 vignetting start?
#   hypothesis  a Tamron rule carries over
#   decides     [schoeps.vigtamron_f28_siemens_w10]
#   evidence    the Tamron f/8 and 17 cm Thorlabs comparisons (opposite directions); this set's runs at 10 and 40
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  the coverage tie-break keeps the frozen default
