# ---- detect: Schöps's camera_calibration ----------------------------------------------------------------------------------------
# args (the tool's command line, one string): frontends_history/drivers/fe_si7.sh:23 — `--model <its central generic model> --cell_length_in_pixels 150 --num_pyramid_levels 4
# --feature_refinement_type gradients_xy $RWINARG`, RWINARG = `--refinement_window_half_extent $RWIN` when RWIN is set (fe_si7.sh:12),
# else the tool's default 10 (camera_calibration main.cc:95 at 00ef4de). The frozen values are in FULL-RESOLUTION sensor pixels, and
# the tool reads the raw grid (owner 2026-11-16), so the frozen full-resolution arguments apply verbatim: nothing halved, nothing
# rounded. (2026-11-10 … 16 the tool read the half-resolution green cells and every pixel argument was halved; the owner dropped that
# rule: halving keeps a window's footprint, not its statistics.) The refinement window is the one argument chosen per set: the frozen
# value and one alternative were run, and the window of record is the better held-out Thorlabs median of the Schöps start (the chrome
# evaluation's scorer, paired photograph bootstrap), ties to the coverage, then the localised count (each run's derivation below).
# rationale (window)
#   question    which refinement window gives the zoom (48 mm, f/10) start of record?
#   hypothesis  the frozen 40, its half or its double scores the lowest held-out Thorlabs median
#   decides     [schoeps.zoom48_f10_siemens_w20]
#   evidence    dgx01 window study (chrome_evaluation_sw_zoom48: 9a2d68eaf794a012; chrome_evaluation_sw_zoom4880: 2300ce36da2173af)
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  the smallest window scores best although it localises the fewest photographs (91 of 171); its coverage of the common dots is the highest (100 %)
[schoeps.zoom48_f10_siemens_w20]
images = "zoom48_f10_siemens"
pattern = "siemens_pattern"
board = "siemens_board"
image = "schoeps_image"
args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 20"   # window 20 (the frozen 40 × ½): held-out Thorlabs median 0.0496 px vs 0.0527 px at 40, Δ −0.0031 [−0.0071, −0.0001] px, and vs 80 Δ(80 − 20) +0.0058 [+0.0010, +0.0115] px (paired photograph bootstrap, 54 photographs); 91 / 148 / 156 of 171 localised at 20 / 40 / 80

# rationale (window)
#   question    which refinement window gives the Tamron f/8 start of record?
#   hypothesis  the frozen 40, its half or its double scores the lowest held-out Thorlabs median
#   decides     [schoeps.tamron_la_siemens_w20]
#   evidence    dgx01 window study (chrome_evaluation_sw_tamron_la: c5100cff95d9ec36; chrome_evaluation_sw_tamron_la80: 7ea4406f46a7a3fd)
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  the smallest window is best in the centre and at the edge, on 91 of 340 localised photographs; the refinement's views list (radiometric_refinement.toml) follows the start's registered views
[schoeps.tamron_la_siemens_w20]
images = "tamron_la_siemens"
pattern = "siemens_pattern"
board = "siemens_board"
image = "schoeps_image"
args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 20"   # window 20 (the frozen 40 × ½): held-out Thorlabs median 0.160 px vs 0.189 px at 40, Δ −0.029 [−0.034, −0.023] px, and vs 80 Δ(80 − 20) +0.031 [+0.025, +0.036] px (paired photograph bootstrap, 190 photographs); 91 / 331 / 330 of 340 localised at 20 / 40 / 80

# rationale (window)
#   question    which refinement window gives the 14 mm central_30cm start of record?
#   hypothesis  the frozen default 10 or its double scores the lower held-out Thorlabs median
#   decides     [schoeps.central30cm_14mm_siemens_w20] and, by the same-lens rule, the 14 mm sets without a Thorlabs pair (texcal_14mm, vig14mm_f4)
#   evidence    dgx01 window study (its scratch root schoeps-window/, chrome_evaluation_sw_central30cm: evaluate e60875c16fcdb04e)
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  both cover 98.1 % of the sensor lattice; the edge gains most (Δ −0.230 px)
[schoeps.central30cm_14mm_siemens_w20]
images = "central30cm_14mm_siemens"
pattern = "siemens_pattern"
board = "siemens_board"
image = "schoeps_image"
args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 20"   # window 20 (the frozen default 10 × 2): held-out Thorlabs median 0.506 px vs 0.591 px at 10, Δ −0.085 [−0.104, −0.067] px (paired photograph bootstrap, 141 photographs, 40 744 common dots); 165 vs 111 of 168 localised

# rationale (window)
#   question    which refinement window gives the Tamron 17 cm start of record?
#   hypothesis  the frozen 40 or a larger window scores the lower held-out Thorlabs median
#   decides     [schoeps.tamron17_siemens_w80] and, with the Tamron f/8 set, the Tamron f/2.8 vignetting set's window
#   evidence    dgx01 window study (chrome_evaluation_sw_tamron17: evaluate 1e09137aaa964846)
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  coverage 99.4 % vs 100 % of the common dots; the centre and the edge both improve (−0.008, −0.029 px)
[schoeps.tamron17_siemens_w80]
images = "tamron17_siemens"
pattern = "siemens_pattern"
board = "siemens_board"
image = "schoeps_image"
args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 80"   # window 80 (the frozen 40 × 2: its 232 of 264 localised suggested a larger window): held-out Thorlabs median 0.161 px vs 0.180 px at 40, Δ −0.019 [−0.023, −0.015] px (paired photograph bootstrap, 112 photographs, 32 170 common dots); 256 vs 232 of 264 localised

# rationale (window)
#   question    which refinement window gives the 14 mm texture-calibration start?
#   hypothesis  the 14 mm's rule (the larger window) carries over
#   decides     [schoeps.texcal_14mm_siemens_w25]
#   evidence    dgx01 window study: 25 → 470/479 localised, median reprojection 0.124 px; 13 → 439/479, 0.114 px
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  no chrome set was photographed with this calibration: the decision rests on the other 14 mm set
[schoeps.texcal_14mm_siemens_w25]
images = "texcal_14mm_siemens"
pattern = "siemens_pattern"
board = "siemens_board"
image = "schoeps_image"
args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 25"   # window 25, the frozen value verbatim (tex_fe_14mm_par.sh:24): no Thorlabs pair; the 14 mm central_30cm set's rule (the larger window, 20 over 10, Δ −0.085 px held-out) favours the larger of 25 and 13, and 25 localises 470 vs 439 of 479

# rationale (window)
#   question    which refinement window gives the fisheye 30 cm start of record?
#   hypothesis  the default 10 or a larger window scores the lower held-out Thorlabs median
#   decides     [schoeps.fisheye30cm_siemens_w30], the fisheye 30 cm rows of the paper's chrome evaluation and, by the same lens, the fisheye f/4 vignetting set's tie-break
#   evidence    dgx01 window study (testtree, chrome_evaluation_sw2_fisheye30cm: evaluate 0bd5c9e365a1c0ef); localised 162 / 34 of 301; the default 10 failed once in dense initialization
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  98 of 254 chrome photographs register (rim views: the dot rows merge; misses, not loosened), 82 assign all but ≤ 13 dots; the edge gains most (Δ −0.97 px)
[schoeps.fisheye30cm_siemens_w30]
images = "fisheye30cm_siemens"
pattern = "siemens_pattern"
board = "siemens_board"
image = "schoeps_image"
args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 30"   # window 30 (the tool default 10 × 3, T. Harder's 15 green cells × 2): held-out Thorlabs median 0.116 px vs 0.194 px at 10, Δ −0.078 [−0.113, −0.056] px (paired photograph bootstrap, 80 common photographs, 22 201 common dots); 162 vs 34 of 301 localised, the valid domain 97.4 % vs 76.2 % of the image circle

# rationale (window)
#   question    which refinement window gives the 14 mm f/4 vignetting start?
#   hypothesis  the 14 mm's rule carries over
#   decides     [schoeps.vig14mm_f4_siemens_w20]
#   evidence    the central_30cm Thorlabs comparison; this set's own runs at 10 and 20 (localised counts in the window-study report)
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  the frozen run (sRGB copies, default 10) localised 166 of 174
[schoeps.vig14mm_f4_siemens_w20]
images = "vig14mm_f4_siemens"
pattern = "siemens_pattern"
board = "siemens_board"
image = "schoeps_image"
args = "--model central_generic --cell_length_in_pixels 150 --num_pyramid_levels 4 --feature_refinement_type gradients_xy --refinement_window_half_extent 20"   # window 20: no Thorlabs pair; the 14 mm central_30cm set's rule (20 over the frozen default 10, Δ −0.085 px held-out); 174 vs 169 of 174 localised at 20 vs 10, coverage 99.3 % of the housing's circle at 10

# rationale (window)
#   question    which refinement window gives the fisheye f/4 vignetting start?
#   hypothesis  the fisheye's rule (coverage, then the localised count) carries over
#   decides     [schoeps.vigfisheye_f4_siemens_w10]
#   evidence    dgx01 window study: 10 → 71/160, 99.8 %; 30 → 58/160, 98.9 %
#   owner       J. Pritts (2026-11-16: raw_green, the frozen arguments verbatim, the window on the held-out Thorlabs median)
#   date        2026-11-16
#   discussion  the frozen run on the sRGB copies used 63 views (excluded.txt: two dropped)
[schoeps.vigfisheye_f4_siemens_w10]
images = "vigfisheye_f4_siemens"
