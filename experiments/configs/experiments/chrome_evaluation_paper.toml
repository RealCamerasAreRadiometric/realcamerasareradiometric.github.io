# start, the refinement and the change of the four statistics, one rotation centre, held out (variant "motion_heldout") with the in-sample score and the gap; written to
# plots/latex/table_refinement_chrome.tex (not deployed: the paper's Tab. 2 is the external refinement-table-ci.tex)
variant = "motion_heldout"     # the headline: the parity-interleaved hold-out (each rotation-centre fit on one parity of the grid nodes scores the other; holdout = "on" in the sets' configs, owner 2026-11-15)
confidence = "on"              # beside each change, the refined − start difference's 95 % interval of the set's paired photograph bootstrap (paired.tsv; owner 2026-11-15), * where it excludes 0
in_sample_variant = "motion"   # beside it, per statistic: the refinement's in-sample score (the fit on every dot it scores) and the gap, held-out − in-sample [px]
stats = ["median_px", "mean_px", "p95_px", "rms_px"]
layout = "blocks"
label = "tab:refinement-chrome"
worse_color = "red"            # the refined value and change of a statistic that did not improve, in red
mark_best = "on"               # the best value of each statistic per camera (the rows of one chrome set: both 14 mm blocks together), bold (owner 2026-11-15)
inline_change = "on"           # per statistic "start → refined (change %)": an arrow between the values, the change in brackets behind the refinement, no % column (owner 2026-11-15)
caption = "Chrome-board residuals [px] of each model's geometric calibration (start) and after our radiometric refinement (refined), with one rotation centre for all chrome photographs of a set: the median, mean, 95th percentile and RMS, each as start $\\rightarrow$ refined with the change in percent in brackets (negative: an improvement; red: no improvement; bold: the best value of each camera). Held out: each rotation-centre fit sees one parity of the grid's dots and scores the other."
