# The paper config of record of the chrome evaluation (scripts/chrome_evaluation_paper.jl --config=<this>): the paper's chrome outputs,
# straight from the chrome-board evaluations (scripts/chrome_evaluation.jl, ONE config per chrome set, [chrome.<key>] config: every
# model scored on it — each start and its refinement — a row of its [evaluate] models; a table row or a figure panel names the set and
# the row's label). Its stages (src/chrome_evaluation_paper.jl): sets — each set's pending stages (prepare, detect on the GPU, index,
# evaluate) — and figures (the tables, their numbers and the residual maps):
#   fig:color-wheels (color-wheels.png)  rows Tamron + OpenCV's Brown–Conrady on the AprilGrid at 17 cm, 14 mm + OpenCV-14 on the
#                                        Siemens board (central_30cm), fisheye + the central spline of Schöps's pipeline on the AprilGrid at 10 cm;
#                                        columns the geometric start and the radiometric refinement, the residuals as arrows; one
#                                        rotation centre
#   [tables.<name>] (table_<name>.{tsv,md,tex})  the median, mean, 95th percentile and RMS of the start and the refinement (one
#                                        rotation centre) and the change in percent — radiometric_refinement (tab:refinement-chrome: every
#                                        model on the geometric-accuracy sets), defocus (tab:defocus: the Tamron f/8 central spline
#                                        with the aperture and the focus surface and as a pinhole), chrome_all (every model on every
#                                        chrome set, a results table)
# The geometric-accuracy sets: the 14 mm central_30cm (Siemens stars, AprilGrid400), the fisheye at 10 cm (AprilGrid), the 27.10
# fisheye Siemens stars (excluded; from 2026-11-16 the 30 cm fisheye Siemens set), the Tamron Siemens stars at 17 cm and the Tamron
# AprilGrid set of 2026-11-08.
#
# [chrome.<key>] keys: <lens>[_<set>], one per chrome set — fourteen (the 14 mm's central_30cm chrome photographs: the models of its
# Siemens stars and of its AprilGrid400) | fisheye_tenth (the fisheye at 10 cm, AprilGrid) | fisheye_si27 (the 27.10 fisheye Siemens
# stars, excluded) | fisheye_si30 (the fisheye 30 cm session's Siemens stars) | tamron_si17 (the Tamron Siemens stars at 17 cm) | tamron_ag08 (the Tamron AprilGrid set of 2026-11-08) | tamron_la (the
# Tamron at f/8) | zoom48 (the zoom lens at 48 mm, f/10: the defocus experiment's third lens).
# The block ends at the marker line `# --- end of [chrome] ---`; a [tables.<name>] rows list holds one row per line and closes with `]`
# on its own line.

[experiment]
name = "chrome_evaluation_paper"

[inputs]

[chrome.fourteen]
config = "configs/experiments/chrome_evaluation_fx3_14mm_central30cm.toml"

[chrome.fisheye_tenth]
config = "configs/experiments/chrome_evaluation_fx3_fisheye_10cm_ag.toml"

[chrome.tamron_la]
config = "configs/experiments/chrome_evaluation_fx3_tamron_largeaperture.toml"

[chrome.tamron_si17]
config = "configs/experiments/chrome_evaluation_fx3_tamron_17cm_si.toml"

# the paper's fisheye Siemens set in place of the excluded 27.10 set (owner 2026-11-16): the 30 cm session (its Siemens set the front
# end's [cases.fisheye30cm_siemens]); its rows are the Schöps start and the index fit, each with its refinement (radiometric_refinement.toml
# cases si30fe_spline_warped, si30fe_kb_warped)
[chrome.fisheye_si30]
config = "configs/experiments/chrome_evaluation_fx3_fisheye_30cm_si.toml"

[chrome.tamron_ag08]
config = "configs/experiments/chrome_evaluation_fx3_tamron_20261108_ag.toml"

[chrome.zoom48]
config = "configs/experiments/chrome_evaluation_fx3_zoom48_f10.toml"

# --- end of [chrome] ---

[figures.color_wheels]
asset = "color-wheels.png"
variant = "motion"             # one rotation centre for the chrome set (the evaluation's motion fit)
size = [4256, 2848]
cols = 2
dpi = 150
title = ""
# the residuals as thin black arrows instead of dense colour wheels —
# src/figures.jl arrow_wheel_figure: of every one of `cells_x` cells across the sensor the measurement nearest its centre, its arrow's
# length `vmax` px = 0.95 of a cell of `len_cells_x` across the sensor, the key in each panel; `view` per row: sensor | overflow (the
# 14 mm: the sensor as the border, its arrows running past it) | zoom (the fisheye: its measured area enlarged).
style = "arrows"
cells_x = 45
len_cells_x = 32
panels = [
    {chrome = "tamron_ag08", model = "ag08ta_bc5_start", label = "Tamron · Brown–Conrady (OpenCV, AprilGrid): geometric calibration", vmax = 0.5, view = "sensor"},
    {chrome = "tamron_ag08", model = "ag08ta_bc5_refined", label = "Tamron · Brown–Conrady: radiometric refinement (ours)", vmax = 0.5, view = "sensor"},
    {chrome = "fourteen", model = "si30_ocv14_start", label = "14 mm · OpenCV-14 (Siemens stars): geometric calibration", vmax = 1.0, view = "overflow"},
    {chrome = "fourteen", model = "si30_ocv14_refined", label = "14 mm · OpenCV-14: radiometric refinement (ours)", vmax = 1.0, view = "overflow"},
    {chrome = "fisheye_tenth", model = "ag10fe_spline_start", label = "fisheye · central spline (Schöps, AprilGrid at 10 cm): geometric calibration", vmax = 3.0, view = "zoom"},
    {chrome = "fisheye_tenth", model = "ag10fe_spline_refined", label = "fisheye · central spline: radiometric refinement (ours)", vmax = 3.0, view = "zoom"},
]

# (the fisheye 27.10 Siemens set's rows: dropped from the paper's tables — configs/excluded.toml [excluded.fisheye2710_siemens], owner 2026-11-15)
[tables.chrome_all]
# every model on every chrome set: the four statistics of the start (blank where the set's configs evaluate no start: the Tamron f/8
# pairs) and the refinement, one rotation centre, held out (variant "motion_heldout") with the in-sample score and the gap; the set labels group the rows of the md / tex tables
variant = "motion_heldout"     # the headline: the parity-interleaved hold-out (each rotation-centre fit on one parity of the grid nodes scores the other; holdout = "on" in the sets' configs, owner 2026-11-15)
confidence = "on"              # beside each change, the refined − start difference's 95 % interval of the set's paired photograph bootstrap (paired.tsv; owner 2026-11-15), * where it excludes 0
in_sample_variant = "motion"   # beside it, per statistic: the refinement's in-sample score (the fit on every dot it scores) and the gap, held-out − in-sample [px]
stats = ["median_px", "mean_px", "p95_px", "rms_px"]
rows = [
    {set = "14 mm · central_30cm · Siemens stars", model = "Brown–Conrady", chrome = "fourteen", start = "si30_bc5_start", refined = "si30_bc5_refined"},
