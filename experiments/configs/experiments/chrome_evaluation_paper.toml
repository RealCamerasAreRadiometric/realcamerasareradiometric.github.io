[tables.defocus]
# the paper's tab:defocus — the defocus experiment: the Tamron 20 mm at f/8 (Siemens stars at ≈ 0.5 m), the central spline refined with
# the aperture and the focus surface and as the plain pinhole, both from the same geometric start, scored on the chrome board (one
# rotation centre), and the zoom lens at 48 mm, f/10, the same pair: one table* with a block per lens, the pinhole row first, then ours
# (layout "blocks", as tab:refinement-chrome; owner 2026-11-15), a non-improvement in red;
# plots/latex/table_defocus.tex (not deployed: the paper's Tab. 3 is the external defocus-table-ci.tex)
# The zoom's Brown–Conrady pair (owner GO 2026-11-17, T. Harder's Table 3 as he defined it): rows beside the spline's, the owner decides which to show.
variant = "motion_heldout"     # the headline: the parity-interleaved hold-out (each rotation-centre fit on one parity of the grid nodes scores the other; holdout = "on" in the sets' configs, owner 2026-11-15)
confidence = "on"              # beside each change, the refined − start difference's 95 % interval of the set's paired photograph bootstrap (paired.tsv; owner 2026-11-15), * where it excludes 0
in_sample_variant = "motion"   # beside it, per statistic: the refinement's in-sample score (the fit on every dot it scores) and the gap, held-out − in-sample [px]
stats = ["median_px", "mean_px", "p95_px", "rms_px"]
layout = "blocks"
label = "tab:defocus"
worse_color = "red"
mark_best = "on"               # the best value of each statistic per camera (its chrome set), bold
inline_change = "on"           # as tab:refinement-chrome
numbers_prefix = "defocus"     # its number macros (\defocus<Row><Stat>{Start,Refined,Change}, \defocus<Stat>ImprovementGain): numbers.tex
caption = "Defocus: chrome-board residuals [px] of the Tamron 20\\,mm at $f/8$ (Siemens stars at $\\approx 0.5$\\,m) and the zoom lens at 48\\,mm, $f/10$, each lens's central spline's geometric calibration (start) and our radiometric refinement with the finite aperture and the focus surface or as a pinhole without defocus, one rotation centre for all chrome photographs: the median, mean, 95th percentile and RMS, each as start $\\rightarrow$ refined with the change in percent in brackets (negative: an improvement; red: no improvement; bold: the best value of each camera). Held out: each rotation-centre fit sees one parity of the grid's dots and scores the other."
rows = [
    {set = "Tamron 20 mm, Siemens stars ($f/8$)", model = "pinhole (no defocus)", chrome = "tamron_la", start = "sitla_spline_start", refined = "sitla_spline_pinhole_refined", macro = "pinhole"},
    {set = "Tamron 20 mm, Siemens stars ($f/8$)", model = "with aperture + focus surface", chrome = "tamron_la", start = "sitla_spline_start", refined = "sitla_spline_refined", macro = "aperture"},
    {set = "zoom 48 mm (f/10)", model = "pinhole (no defocus)", chrome = "zoom48", start = "sizl_spline_start", refined = "sizl_spline_pinhole_refined", macro = "zoomPinhole"},
    {set = "zoom 48 mm (f/10)", model = "with aperture + focus surface", chrome = "zoom48", start = "sizl_spline_start", refined = "sizl_spline_refined", macro = "zoomAperture"},
    {set = "zoom 48 mm (f/10)", model = "Brown–Conrady, pinhole (no defocus)", chrome = "zoom48", start = "sizl_bc5_start", refined = "sizl_bc5_pinhole_refined", macro = "zoomBcPinhole"},
    {set = "zoom 48 mm (f/10)", model = "Brown–Conrady, with aperture + focus surface", chrome = "zoom48", start = "sizl_bc5_start", refined = "sizl_bc5_refined", macro = "zoomBcAperture"},
]

[render]
significant_digits = 3         # of a pixel value in the md and tex tables (the CSV keeps every number raw)
change_digits = 2              # of a change in percent
