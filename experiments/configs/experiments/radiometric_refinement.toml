# 14 mm · Siemens · Brown–Conrady (k1 k2 k3 p1 p2) fitted to Schöps's detections
[cases.si30_bc5_warped]
kind = "lens"
images = "fx3_14mm_siemens_central30cm"
views = "fx3_14mm_siemens_central30cm_si"
[cases.si30_bc5_warped.pipeline.io]
checkpoint_each = "on"
linearize = "off"
channel = "G"
init = "lens:geometric_accuracy/records/central30cm_all/14mm_central30cm_green_si_bc5_fit.json"
[cases.si30_bc5_warped.pipeline.frontend]
type = "schoeps"
schoeps = "run:fx3_14mm_central30cm_schoeps_green"
texture = "geometric_accuracy/data/target/siemens_1m/board/texture.png"
texture_features = "geometric_accuracy/data/target/siemens_1m/board/texture_features.bin"
texture_features_size = [4000, 4000]
page_mm = [1000.0, 1000.0]
print_scale = 1.0
[cases.si30_bc5_warped.pipeline.camera]
sensor_mm = 35.6
f_mm = 14.6776
fnumber = 22.0
lens_coverage = "sensor"       # the lens lights the whole sensor: its rectangle, nothing measured
sensor_characterization = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"   # the FX3's record of record (input fx3_sensor_characterization): every frame of the set resolves at ISO 100 to the Dark of its exposure where the campaign measured it (Matched), else the shared measured channel black (DarkOutOfBand), with the Poisson–Gaussian noise and defects; its gain whitens the residuals (the weighting follows the model)
[cases.si30_bc5_warped.pipeline.masks]
gradient_bias = 0.0          # α = 0, the uniform draw (owner 2026-11-16, the sampling-strategy record rc-results-0.11/sampling_strategy/record/952231f4538a4b78, uniform best on both cases and metrics: the 14 mm a1 − uniform texture at 1 mm +0.0099 [+0.0092, +0.0106], Thorlabs median +0.0046 [+0.0000, +0.0097]; the fisheye n.s. on the median, +0.040 px at p95)
seed = 1
[cases.si30_bc5_warped.pipeline.rendering]
N = 16
n_p = 2
hammersley = "on"
n_rho = 3
n_phi = 8
[cases.si30_bc5_warped.pipeline.lighting]
sh_order = 2
[cases.si30_bc5_warped.pipeline.material]
alpha_ink = 0.6
alpha_noink = 0.6
eta_ink = 2.0
eta_noink = 1.3
mu = 0.244
mu_bounds = [0.0, 1.0]
[cases.si30_bc5_warped.pipeline.vignetting]
model = "radial"
node_count = 19   # the projective chart's 19: 16 functions on the fitted pixels, as the linear 16 (T. Harder; Core 0.10.11)
degree = 3
support_min = 0.1
[cases.si30_bc5_warped.pipeline.warping]
degree = 1
inplane = "none"                 # heights only for the global models (owner decision 2026-11-16; the warping ablation's `heights` mode): no Aspect ∘ Skew, so no inplane_start (INAPPLICABLE_KEYS)
[cases.si30_bc5_warped.pipeline.edge]
sdf = "run:siemens_1m_distance_map"
print_sigma_mm = 0.0277
ink_spread_mm = 0.0
[cases.si30_bc5_warped.pipeline.lm]
max_iter = 25                     # 25, owner 2026-11-14: the 14 mm si30_spline_warped run (Schöps start, photosites + FX3 all-darks) flattened by ~20 iterations (rel-RMS 0.2901 @10, 0.2876 @21, 0.2872 @47); doubling the pixels left the trajectory unchanged to 3–4 digits
max_time = 36000.0
[cases.si30_bc5_warped.pipeline.compute]
backend = "gpu"
jacobian_chunk = 4

