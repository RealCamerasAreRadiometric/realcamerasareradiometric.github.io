# Config of record of the geometric-accuracy refinements (scripts/radiometric_refinement.jl; fig:color-wheels,
# tab:refinement-chrome): per case a geometric start model refined radiometrically on the board photographs, then scored on the
# Thorlabs R3L3S7N1 chrome board under one rotation centre (scripts/chrome_evaluation.jl, configs/experiments/chrome_evaluation_*.toml).
#
# The board model of every case: its heights ([warping] degree as the case states) and, for the central splines (kind = "grid"),
# every target being a print, the print's in-plane aspect and skew ([warping] inplane = "aspect_skew", Core's Aspect ∘ Skew in the
# placed chart, from the design as printed; owner ruling 2026-11-13). The global models (kind = "lens": Brown–Conrady, OpenCV-14,
# Kannala–Brandt, Double Sphere) the heights alone, inplane = "none" (owner decision 2026-11-16: "heights only for the global
# models", the warping ablation's `heights` mode; the ablation is cut). radiometric_refinement_warping.toml held one <base>_warped_print_error copy per set to isolate that block;
# with it on everywhere each copy equalled its base case verbatim, so it was deleted (no duplicate case, no second prepare).
#
# Cases: the 14 mm at ≈ 30 cm (central_30cm: the Siemens board and the chrome board at the same distance; the AprilGrid400) with
#   Brown–Conrady (5), OpenCV-14, Kannala–Brandt and Double Sphere fitted to the front ends' detections, the central spline of Schöps's pipeline — five models
#   on each board (the non-central spline is out of the paper, 2026-11-11); the fisheye at ≈ 10 cm (AprilGrid; the chrome board at the boards' distance)
#   with the same five, the parametric starts OpenCV's own calibrations (cv2.calibrateCamera / cv2.fisheye.calibrate), and the 27.10
#   fisheye Siemens stars at f/32 with the same five; the Tamron 20 mm with the same five — the Siemens stars at ≈ 17 cm and the
#   AprilGrid set of 2026-11-08, each with the chrome board of its own session. The defocus experiment: the Tamron 20 mm at f/8 on the Siemens board,
#   the central spline of Schöps's pipeline refined twice from the same start — the pipeline as it is (the aperture and the focus surface) and the
#   plain pinhole (no aperture, no focus surface) — on the green cells (mode "green", io.channel "G", as every set). The texture
#   experiment's camera: the 14 mm at f/2.8 (focus taped at 1 m), the central spline with the aperture and the focus surface
#   (texcal_14mm_spline_warped), held fixed by scripts/texture_recovery.jl.
# Every set on ALL its registered photographs (the views ≥ 20 stars / ≥ 16 corners); si_fisheye_spline_20261027_warped is also the detector
# bias's radiometry source. The geometric starts of the Siemens-star sets (Tamron f/8, Tamron 17 cm, 14 mm, the 27.10 fisheye, the
# texture calibration, the zoom) are the project's front ends (scripts/frontends.jl, configs/experiments/frontends.toml): Schöps's
# central-generic run from its pinned container on Features' green cells, imported through IO, and the Kannala–Brandt / Double Sphere
# fits by Estimation, read as [runs] by their keys (owner ruling 2026-11-13). The documented exception, initial guesses from other
# systems (inputs of record of tier rc_baselines, imported through IO): the AprilGrid sets (Schöps's dense datasets of OpenCV/our
# corners, Kalibr's Double Sphere), OpenCV's Brown–Conrady / OpenCV-14 / Kannala–Brandt calibrations and the frozen BC5 / OpenCV-14 fits
# (experiments/frontends_history/ of tag v0.10.0; the folder left the working tree after that tag).
#
# Paths are relative to data_root() (VGTK_DATA_ROOT).

[experiment]
name = "radiometric_refinement"

# The settings stated once per model kind (src/drivers.jl inherit_kinds!): every case of the kind inherits them, and a case may not
# state them again (owner rule: one place per setting). The vignetting refinements read these too
# (radiometric_refinement_vignetting.toml [kinds] source).
[kinds.lens.pipeline.masks]
samples_per_view = 8192    # owner 2026-11-16 23:30: 8,192 for every global (parametric) case
[kinds.grid.pipeline.masks]
samples_per_view = 16384   # owner 2026-11-16 23:30: 16,384 for every spline case

