# Config of record of the chrome-board evaluation of the chrome set fisheye_30cm_si (scripts/chrome_evaluation.jl): ONE config per chrome
# set, every model scored on it a row of [evaluate] models. The paper's fisheye Siemens set from 2026-11-16 (owner): it replaces the
# excluded 27.10 set (configs/excluded.toml [excluded.fisheye2710_siemens]) in the paper's chrome evaluation.
#
# The set: the chrome-board evaluation of the 254 FX3 + Sigma 8 mm fisheye chrome photographs of the 30 cm session (T. Harder,
# 2026-11-14, DSC04443 … DSC04701; the Siemens set of the same session is frontends.toml [cases.fisheye30cm_siemens]): Förstner
# detection of the 289 backlit dots of the Thorlabs R3L3S7N1 target on the bilinear green on the raw grid, their registration against
# the target's grid (RANSAC through the index camera: Estimation's Kannala–Brandt fit, frontends.toml [fits.fisheye30cm_kb]), and the
# evaluation of the session's starts (one rotation centre for the set, from the poses of the index stage's RANSAC local
# optimization) and of their refinements, cases si30fe_spline_warped and si30fe_kb_warped of configs/experiments/radiometric_refinement.toml.
#
# rationale (owner convention: question / hypothesis / decides / evidence / owner / date / discussion)
#   question    does Schöps's start of the fisheye 30 cm set hold on held-out chrome dots, and at which refinement window?
#   hypothesis  the window of record scores the lower held-out median (the chrome evaluation's scorer, paired photograph bootstrap)
#   decides     the fisheye Siemens rows of the paper's chrome evaluation (in place of the 27.10 set) and frontends.toml's window
#   evidence    the window study on branch schoeps-window (its scratch root on dgx01, schoeps-window/, with the report beside it)
#   owner       J. Pritts (2026-11-16: raw_green for Schöps and the Thorlabs detect; the 30 cm set replaces the 27.10 set)
#   date        2026-11-16
#   discussion  the excluded 27.10 set had 40 usable views; the 30 cm set has 301 Siemens and 254 chrome photographs

[experiment]
name = "chrome_evaluation"

[upstream]
radiometric_refinement = "configs/experiments/radiometric_refinement.toml"

[inputs.fx3_sensor_characterisation]
tier = "unpublished"
path = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"
sha256 = "add8fc120b83806d1e70ecf4252a3b0bcf64d9fe007f42886789212f8c155737"   # sha256sum of the record of record (dgx01, 2026-11-14)
stage = "detect"
provenance = "the Sony ILME-FX3's sensor characterisation at ISO 100 (vgio/sensor_characterisation/v2.0, VisualGeometryToolkitIO 0.10.2), made on dgx01 2026-11-14 from the tier rc_sensor_characterisation_20261113 with Core 0.10.3's estimators (scratch e4_alldarks_one.jl + e4_record_alldarks.jl; the experiments' sensor_characterisation experiment reproduces it): black = a Darks of 21 Darks, one per E1_E2 exposure (each burst's master dark, its exposure band the darks' EXIF exposure), their shared channel black the 50 E1 1/8000 s frames' (measured, 512.29/512.23/512.31/512.24 codes); noise = a measured Poisson–Gaussian law (gain K = 11.32987 ± 0.00433 e⁻/code from photon_transfer on the E4 frames, σ_r per colour from E1), defects = 23,544 photosites by defect_onsets over every E1_E2 exposure (EXIF onsets); its 42 rasters fx3.sensor_characterisation.gain-exifband-alldarks.iso100.band<k>.dark_{offset,variance}.tiff beside it, verified by IO on load; supersedes fx3.sensor_characterisation.gain-exifband.json (owner 2026-11-14: a Dark per measured exposure); kept on dgx01 under the unpublished root and linked into the data root (next tier to pack: rc_sensor_models, data_artifacts.toml)"


[inputs.raw]
tier = "rc_raw_photos"
path = "paper-data/geometric-accuracy/fisheye_30cm/chrome"
stage = "prepare"
provenance = "the 254 chrome photographs of the FX3 + Sigma 8 mm fisheye of the 30 cm session (T. Harder, 2026-11-14, DSC04443 … DSC04701): the RAW photographs (.ARW); on the cluster only"

[inputs.raw_fisheye_siemens_30cm]
tier = "rc_raw_photos"
path = "paper-data/geometric-accuracy/fisheye_30cm/siemens-stars"
stage = "evaluate"
provenance = "the 301 Siemens-star photographs of the same session (frontends.toml [inputs.raw_fisheye_siemens_30cm]): the session's coverage frames ([image_regions.fx3_fisheye_siemens_30cm])"

# The chrome set's lens coverage (src/image_region.jl; owner ruling 2026-11-15): the session's, measured on five of its Siemens frames
# at the same f/32 — the front end's step (frontends.toml [image_regions.fx3_fisheye_siemens_30cm]: the same table, the same key).
[image_regions.fx3_fisheye_siemens_30cm]
input = "raw_fisheye_siemens_30cm"
frames = { "DSC04702.ARW" = "a94aca8f0baf0607ec929f4a5a24ccc942475227af15ab41687121ca166fd0dc", "DSC04777.ARW" = "e924aa327cf8d667794ee736ebd3ec940aafbc53cdeda8e796910c887ab5902c", "DSC04854.ARW" = "bbba2e2934e5ec291f061bae4ad17f6786a66927464c207c3d9ff8efdfa2535e", "DSC04931.ARW" = "9879362fade0ec547613f22e25257ce61289f9bd77e819ef8922b1a9f3919e64", "DSC05008.ARW" = "648425aeb159dc1950113970d08715acad15e8fb548f6a36f2e33267fa558d0c" }   # sha256sum on dgx01 (2026-11-16)
image = "raw_green"           # the geometry image (owner 2026-11-16): the bilinear green on the raw grid at full resolution, the chrome detect's image
outlier_halfwidth_px = 1000.0  # raw px: the owner's 1000 px (ruling 2026-11-12, chosen on full-resolution frames), as every fisheye region of record
seed = 1                       # as every region of record

[inputs.target]
tier = "rc_thorlabs"
path = "geometric_accuracy/data/target/thorlabs_r3l3s7n1/target.json"
sha256 = "9fd2754a2aa7e278a18d95df15e07140b87bc115dec47be169adebe085fab880"   # sha256sum of the file of record (the local data root and dgx01's rc-vgtk-root agree, 2026-11-12)
stage = "index"
provenance = "scripts/make_targets.jl from configs/targets/thorlabs_r3l3s7n1.toml (the maker's drawing R3L3S7N1, 15 Nov 2024): 17 x 17 dots at 5.000 mm, calibration Rigid (vgio/target/v3 by vgio_migrate_tree)"


[runs.camera]
config = "configs/experiments/frontends.toml"
run = "fits.fisheye30cm_kb"
path = "camera.json"
stage = "index"
provenance = "the Kannala–Brandt camera Estimation fitted to the fisheye 30 cm set's imported Schöps detections (frontends.toml [fits.fisheye30cm_kb])"

[prepare.fx3_fisheye30cm_chrome]
raw = "raw"
mode = "photosites"               # read, not decoded: the RAW photographs linked with their EXIF (Features' load_raw_metadata); detect reads each mosaic

[detect]
sensor_characterisation = "fx3_sensor_characterisation"   # the FX3's record of record (input fx3_sensor_characterisation): each RAW re-linearised under its frame's model, its Poisson–Gaussian noise propagated into the detections' covariances
photos = "fx3_fisheye30cm_chrome"
image = "raw_green"               # the RAW mosaics behind prepare's set, Features' bilinear green on the raw grid under each frame's sensor model; raw pixels
precision = "Float32"
device = "gpu"                   # detect_foerstner on the GPU (KernelAbstractions; device 0 of the job)
derivative = "gaussian2d"
derivative_sigma = 2.0                # raw px: 1.0 green cell (the value of record on the green cells until RC 0.10.2) × 2 raw px per cell
polarity = "light"                # the backlit dots are bright on the dark chrome: Features' polarity gate keeps light blobs only, a dark blob (a gap, a shadow) never seeds (owner 2026-11-14)
precision_threshold = 1.0             # raw px: SFOP's point σ gate, 0.5 green cell (the value of record until RC 0.10.2) × 2 raw px per cell
significance_level = 0.999

