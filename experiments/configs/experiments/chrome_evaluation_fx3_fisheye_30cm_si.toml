[index]
target = "target"
camera = "camera"
camera_name = "cam"
target_id = "thorlabs_r3l3s7n1"
label = "circular"
scoring = { type = "msac" }        # RANSAC's scorer (the stack's SCORING_TAGS): MSAC on the board-plane residual (mm) of the Hungarian's one-to-one matches; its threshold is NOT stated here — it is half the target record's pitch (2.5 mm at 5 mm), the assignment's dustbin, derived in code (owner 2026-11-14)
seed_tolerance = 5.0
rng_seed = 1
min_assigned = 145

[index.ransac]
success_prob = 0.999               # the chrome configs' value of record since their renames (2026-11-12), above Estimation's default 0.99 (configs/default.toml [ransac])
max_trials = 10000                 # Estimation's default (configs/default.toml [ransac]): the cap, never reached (after4: every photograph stopped at min_trials)
min_trials = 200                   # owner 2026-11-14: twice the 100 that every photograph of after4 stopped at (the confidence rule is met far earlier — the grid sampler's draws are correct at the right parity), as margin

# RANSAC's local optimization (src/chrome_evaluation.jl register_grid; owner 2026-11-14): Estimation's Irls strategy at the Gaussian
# shape — plain least squares, not robust: the scorer's matches of the hypothesis are within its threshold by construction — on
# those matches, frozen (the GridPoseProblem's refine!: the board-plane residuals, mm, by Core's chart LM; the Hungarian is not
# re-run), at most max_iter iterations.
[index.local_optimization_strategy]
type = "irls"
loss = "gaussian"                 # plain least squares (the Gaussian shape: no width); its posterior iteration weighs the consensus set alone from Estimation 0.11.2
max_iter = 10

# The photograph's pixel refine after RANSAC (register_grid): Estimation's refine_absolute_pose through the camera on the final
# Hungarian's matches, plain least squares (owner 2026-11-14: no robust loss in the index). The MAD scale of its pixel residuals
# is recorded as the photograph's, pooled per set by the evaluate stage (its Huber width).
[index.refine_strategy]
type = "none"                     # a refine's least squares (optimization_strategy = nothing)

[index.excluded]

[runs.start_si30fe_spline]
config = "configs/experiments/frontends.toml"
run = "schoeps.fisheye30cm_siemens_w30"
path = "camera.json"
stage = "evaluate"
provenance = "T. Schöps's central-generic of the fisheye 30 cm Siemens set made by the project's front end (frontends.toml [schoeps.fisheye30cm_siemens_w30]: the bilinear green on the raw grid (owner 2026-11-16), cell 150, window 30, the frozen arguments verbatim)"

[runs.start_si30fe_kb]
config = "configs/experiments/frontends.toml"
run = "fits.fisheye30cm_kb"
path = "camera.json"
stage = "evaluate"
provenance = "the Kannala–Brandt camera Estimation fitted to the set's imported Schöps detections (frontends.toml [fits.fisheye30cm_kb]), the index camera"

# The fisheye 30 cm set's Double Sphere and OpenCV-14 starts (owner GO 2026-11-17 05:00, "run them ourselves": overrides the
# no-refits ruling for these two starts), made as the other Siemens sets' starts of record (si17ta_ds, si17ta_ocv14)
[runs.start_si30fe_ds]
config = "configs/experiments/frontends.toml"
run = "fits.fisheye30cm_ds"
path = "camera.json"
stage = "evaluate"
provenance = "the Double Sphere camera Estimation fitted to the set's imported Schöps detections (frontends.toml [fits.fisheye30cm_ds]; owner GO 2026-11-17 05:00)"

[inputs.start_si30fe_ocv14]
tier = "rc_baselines"
path = "geometric_accuracy/records/fisheye30cm_si_all/fisheye30cm_si_all_green_ocv14_cv2.json"
sha256 = "034de45cca9ad2c94b5b8c016314411efb51b1deb89102784cefbee2af97ee5f"   # sha256sum of the record of record (dgx01, 2026-11-17)
stage = "evaluate"
provenance = "the start of case si30fe_ocv14_warped (configs/experiments/radiometric_refinement.toml): OpenCV's own calibration of the model, cv2.calibrateCamera with CALIB_RATIONAL_MODEL | CALIB_THIN_PRISM_MODEL | CALIB_TILTED_MODEL on Schöps's star detections (views >= 20 features: fe_si7.sh's MINF = 20, as every Siemens-set OpenCV record of record; OpenCV 4.12.0) of the set's Schöps run of record (frontends.toml [schoeps.fisheye30cm_siemens_w30], dataset.bin) by T. Harder's experiments/tools/opencv_calibrate_schoeps.py (verbatim from v0.10.0 frontends_history/scripts; fe_si7.sh's arguments), converted to vgio/cameras/v4 by experiments/tools/ocv_record.jl (owner GO 2026-11-17 05:00)"

[evaluate]
index = "stage"
target = "target"
optimization_strategy = { type = "triggs", loss = "huber" }   # the rotation-centre refine (src/chrome_evaluation.jl evaluate_grid_models: Estimation's refine_camera_and_poses on RotationCenterViews, the camera held): the Triggs-corrected Huber LM at the efficiency table's Huber constant for d = 2 (Core's efficiency_constant(HuberShape, 2)) × the index stage's pooled noise scale (a refine estimates none)
iterations = 80
profile_bins = 10
lens_coverage = "image_region:fx3_fisheye_siemens_30cm"   # the session's measured image region (its Siemens frames, the front end's step): the radial profile about its centre out to its rim
centre_rho = 0.4                # the summary's centre region: ρ = |𝐩 − centre| / rmax below 0.4 (the regions of record)
edge_rho = 0.6                  # the summary's edge region: ρ above 0.6
holdout = "on"                  # the parity-interleaved hold-out (motion_heldout, the paper's headline; owner 2026-11-15): each fit on one parity of the grid nodes, scoring the other
bootstrap = { resamples = 10000, seed = 20261115, alpha = 0.05 }   # the paired photograph bootstrap of the comparisons (src/chrome_evaluation.jl paired_differences, Eval's bootstrap_ci): 10,000 draws (the owner's count, 2026-11-15: the 2.5 % / 97.5 % tails each rest on 250 draws), StableRNG of the date of the ruling, the 95 % interval
# every refinement against its start (its label with _start for _refined) and every model against the Schöps baseline of its target (T. Schöps's own camera; the label's prefix): model − reference
comparisons = [
    {model = "si30fe_ds_refined", reference = "si30fe_ds_start"},
    {model = "si30fe_kb_refined", reference = "si30fe_kb_start"},
    {model = "si30fe_ocv14_refined", reference = "si30fe_ocv14_start"},
    {model = "si30fe_spline_refined", reference = "si30fe_spline_start"},
    {model = "si30fe_ds_start", reference = "si30fe_spline_start"},
    {model = "si30fe_ds_refined", reference = "si30fe_spline_start"},
    {model = "si30fe_kb_start", reference = "si30fe_spline_start"},
    {model = "si30fe_kb_refined", reference = "si30fe_spline_start"},
    {model = "si30fe_ocv14_start", reference = "si30fe_spline_start"},
    {model = "si30fe_ocv14_refined", reference = "si30fe_spline_start"},
]
max_unassigned = 13                # as the fisheye 27.10 set (and the Tamron): a fisheye grid near the rim loses up to 13 dots
models = [
    {label = "si30fe_spline_start", kind = "schoeps", input = "start_si30fe_spline"},   # the Schöps baseline: T. Schöps's OWN camera (his run imported onto the raw grid)
