stage = "evaluate"
provenance = "the start of case ag10fe_ds_warped (configs/experiments/radiometric_refinement.toml): the Double Sphere start (Kalibr ds-none on an AprilGrid set; a DS fit to Schöps's detections on a Siemens set — rc-results night_2026-11-06/tools/fe_ds.sh)"

