[inputs.start_ag10fe_spline]
tier = "rc_baselines"
path = "geometric_accuracy/night_stars/data/fx3-fisheye-aprilgrid-10cm-all/schoeps_dense_aruco_green"
stage = "evaluate"
provenance = "the start of case ag10fe_spline_warped: T. Schöps's central-generic (configs/experiments/radiometric_refinement.toml)"

[evaluate]
index = "stage"
target = "target"
optimization_strategy = { type = "triggs", loss = "huber" }   # the rotation-centre refine (src/chrome_evaluation.jl evaluate_grid_models: Estimation's refine_camera_and_poses on RotationCenterViews, the camera held): the Triggs-corrected Huber LM at the efficiency table's Huber constant for d = 2 (Core's efficiency_constant(HuberShape, 2)) × the index stage's pooled noise scale (a refine estimates none)
iterations = 80
profile_bins = 10
lens_coverage = "image_region:fx3_fisheye_aprilgrid_10cm"   # the session's measured image region: the radial profile about its centre out to its rim (centre (2126.8, 1434.9), rmax 1095 px as typed before 2026-11-15)
centre_rho = 0.4                # the summary's centre region: ρ = |𝐩 − centre| / rmax below 0.4 (the regions of record)
edge_rho = 0.6                  # the summary's edge region: ρ above 0.6
holdout = "on"                  # the parity-interleaved hold-out (motion_heldout, the paper's headline; owner 2026-11-15): each fit on one parity of the grid nodes, scoring the other
bootstrap = { resamples = 10000, seed = 20261115, alpha = 0.05 }   # the paired photograph bootstrap of the comparisons (src/chrome_evaluation.jl paired_differences, Eval's bootstrap_ci): 10,000 draws (the owner's count, 2026-11-15: the 2.5 % / 97.5 % tails each rest on 250 draws), StableRNG of the date of the ruling, the 95 % interval
# every refinement against its start (its label with _start for _refined) and every model against the Schöps baseline of its target (T. Schöps's own camera; the label's prefix): model − reference
comparisons = [
    {model = "ag10fe_bc5_refined", reference = "ag10fe_bc5_start"},
    {model = "ag10fe_ds_refined", reference = "ag10fe_ds_start"},
    {model = "ag10fe_kb_refined", reference = "ag10fe_kb_start"},
    {model = "ag10fe_ocv14_refined", reference = "ag10fe_ocv14_start"},
    {model = "ag10fe_spline_refined", reference = "ag10fe_spline_start"},
    {model = "ag10fe_bc5_start", reference = "ag10fe_spline_start"},
    {model = "ag10fe_bc5_refined", reference = "ag10fe_spline_start"},
    {model = "ag10fe_ds_start", reference = "ag10fe_spline_start"},
    {model = "ag10fe_ds_refined", reference = "ag10fe_spline_start"},
    {model = "ag10fe_kb_start", reference = "ag10fe_spline_start"},
    {model = "ag10fe_kb_refined", reference = "ag10fe_spline_start"},
    {model = "ag10fe_ocv14_start", reference = "ag10fe_spline_start"},
    {model = "ag10fe_ocv14_refined", reference = "ag10fe_spline_start"},
]
max_unassigned = 8                # through the central camera of record most photographs leave a few rim dots > 8 px off
                                  # (all 289 detected); a labelling shifted by a whole spacing would leave a row of 17 unassigned, so ≤ 8
                                  # keeps it pinned. The unassigned dots are those where the camera of record (case ag10fe_kb_warped's start)
                                  # is worst, so the selection still leans toward that start, ≤ 8 of 289 dots per photograph.
models = [
    {label = "ag10fe_bc5_start", kind = "lens", input = "start_ag10fe_bc5"},
    {label = "ag10fe_bc5_refined", kind = "lens", case = "ag10fe_bc5_warped"},
    {label = "ag10fe_ds_start", kind = "lens", input = "start_ag10fe_ds"},
    {label = "ag10fe_ds_refined", kind = "lens", case = "ag10fe_ds_warped"},
    {label = "ag10fe_kb_start", kind = "lens", input = "start_ag10fe_kb"},
    {label = "ag10fe_kb_refined", kind = "lens", case = "ag10fe_kb_warped"},
    {label = "ag10fe_ocv14_start", kind = "lens", input = "start_ag10fe_ocv14"},
    {label = "ag10fe_ocv14_refined", kind = "lens", case = "ag10fe_ocv14_warped"},
    {label = "ag10fe_spline_start", kind = "schoeps", input = "start_ag10fe_spline"},   # the Schöps baseline: T. Schöps's OWN camera (his run's camera record), never a grid re-estimated from it (src/chrome_evaluation.jl check_schoeps_baseline)
    {label = "ag10fe_spline_refined", kind = "grid", case = "ag10fe_spline_warped"},
]
