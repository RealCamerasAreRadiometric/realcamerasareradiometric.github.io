# Config of record of the chrome-board evaluation of the chrome set zoom48_f10 (scripts/chrome_evaluation.jl): ONE config per chrome
# set, every model scored on it a row of [evaluate] models (3 rows: Ties, Mattermost 2026-11-13 — "1. Schöps calibration, 2. ours with
# aperture and focus surface, 3. radiometric refinement with pinhole only. All scored on the chrome board.").
#
# The set: the FX3 + the zoom lens at 48 mm, f/10 (EXIF lens "DT 24-70mm F3 SAM", not electronically coupled; tab:defocus's third lens):
# Förstner detection of the 289 backlit dots of the Thorlabs R3L3S7N1 target on the GREEN PHOTOSITES (stage prepare: [prepare] mode
# "photosites", the RAW photographs and their EXIF; [detect] image "raw_green": the bilinear green on the raw grid), their registration against the target's grid (RANSAC
# through the set's index camera: the Kannala–Brandt lens Estimation fitted to Schöps's detections, configs/experiments/frontends.toml
# [fits.zoom48_f10_kb] — the route of the Tamron f/8 set's index, there OpenCV's), and the evaluation of the start (Schöps's
# central-generic of the set, frontends.toml [schoeps.zoom48_f10_siemens_w20], imported onto the raw grid) and the cases
# sizl_spline_warped and sizl_spline_pinhole_warped of configs/experiments/radiometric_refinement.toml. Every [detect], [index] and
# [evaluate] setting is the Tamron f/8 set's (chrome_evaluation_fx3_tamron_largeaperture.toml), the same route.

[experiment]
name = "chrome_evaluation"

[upstream]
radiometric_refinement = "configs/experiments/radiometric_refinement.toml"

[inputs.fx3_sensor_characterization]
tier = "unpublished"
path = "sensor_characterisation/fx3.sensor_characterisation.gain-exifband-alldarks.json"
sha256 = "add8fc120b83806d1e70ecf4252a3b0bcf64d9fe007f42886789212f8c155737"   # sha256sum of the record of record (the B200 server, 2026-11-14)
stage = "detect"
provenance = "the Sony ILME-FX3's sensor characterisation at ISO 100 (vgio/sensor_characterisation/v2.0, VisualGeometryToolkitIO 0.10.2), made on the B200 server 2026-11-14 from the tier rc_sensor_characterisation_20261113 with Core 0.10.3's estimators (scratch e4_alldarks_one.jl + e4_record_alldarks.jl; the experiments' sensor_characterization experiment reproduces it): black = a Darks of 21 Darks, one per E1_E2 exposure (each burst's master dark, its exposure band the darks' EXIF exposure), their shared channel black the 50 E1 1/8000 s frames' (measured, 512.29/512.23/512.31/512.24 codes); noise = a measured Poisson–Gaussian law (gain K = 11.32987 ± 0.00433 e⁻/code from the photon transfer (Core's PhotonTransfer) on the E4 frames, σ_r per colour from E1), defects = 23,544 photosites by defect_onsets over every E1_E2 exposure (EXIF onsets); its 42 rasters fx3.sensor_characterisation.gain-exifband-alldarks.iso100.band<k>.dark_{offset,variance}.tiff beside it, verified by IO on load; supersedes fx3.sensor_characterisation.gain-exifband.json (owner 2026-11-14: a Dark per measured exposure); kept on the B200 server under the unpublished root and linked into the data root (next tier to pack: rc_sensor_models, data_artifacts.toml)"

[inputs.raw]
tier = "rc_raw_photos"
path = "paper-data/defocus/zoom-lens/chrome"
stage = "prepare"
provenance = "the 54 chrome photographs DSC03472.ARW … DSC03525.ARW (Sony ILME-FX3) of the Thorlabs R3L3S7N1 target with the zoom lens at 48 mm (EXIF lens \"DT 24-70mm F3 SAM\"), f/10, 1/500 s, ISO 100, manual focus, captured on 2026-11-11 15:05–15:10 (configs/data_artifacts.toml defocus/zoom-lens/chrome; rotation about one point)"

[inputs.target]
tier = "rc_thorlabs"
path = "geometric_accuracy/data/target/thorlabs_r3l3s7n1/target.json"
sha256 = "9fd2754a2aa7e278a18d95df15e07140b87bc115dec47be169adebe085fab880"   # sha256sum of the file of record (the local data root and the B200 server's rc-vgtk-root agree, 2026-11-12)
stage = "index"
provenance = "scripts/make_targets.jl from configs/targets/thorlabs_r3l3s7n1.toml (the maker's drawing R3L3S7N1, 15 Nov 2024): 17 x 17 dots at 5.000 mm, calibration Rigid (vgio/target/v3 by vgio_migrate_tree)"

[runs.camera]
config = "configs/experiments/frontends.toml"
run = "fits.zoom48_f10_kb"
path = "camera.json"
stage = "index"
provenance = "the Kannala–Brandt lens VisualGeometryToolkitEstimation fitted to Schöps's detections of the zoom set's Siemens photographs (scripts/frontends.jl, configs/experiments/frontends.toml [fits.zoom48_f10_kb]: a Ransac on Estimation's AbsolutePoseProblem per view, then Core's LevenbergMarquardt on its CameraPosesProblem): the index's camera"

[prepare.fx3_zoom48_f10_chrome]
raw = "raw"
mode = "photosites"               # read, not decoded: the RAW photographs linked with their EXIF (Features' load_raw_metadata); detect reads each mosaic

[detect]
sensor_characterization = "fx3_sensor_characterization"   # the FX3's record of record (input fx3_sensor_characterization): each RAW re-linearised under its frame's model, its Poisson–Gaussian noise propagated into the detections' covariances
photos = "fx3_zoom48_f10_chrome"
image = "raw_green"               # the RAW mosaics behind prepare's set, Features' bilinear green on the raw grid under each frame's sensor model; raw pixels
precision = "Float32"
device = "gpu"                   # detect_foerstner on the GPU (KernelAbstractions; device 0 of the job)
derivative = "gaussian2d"
derivative_sigma = 2.0                # raw px: 1.0 green cell (the value of record on the green cells until RC 0.10.2) × 2 raw px per cell
polarity = "light"                # the backlit dots are bright on the dark chrome: Features' polarity gate keeps light blobs only, a dark blob (a gap, a shadow) never seeds (owner 2026-11-14)
precision_threshold = 1.0             # raw px: SFOP's point σ gate, 0.5 green cell (the value of record until RC 0.10.2) × 2 raw px per cell
significance_level = 0.999

photographs = [                 # the photographs detected (each its own scale: detect_sfop); the others are [detect.excluded]
    "DSC03472.ARW",
