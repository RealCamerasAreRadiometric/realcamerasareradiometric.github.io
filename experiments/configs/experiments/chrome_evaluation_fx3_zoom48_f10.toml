[detect.excluded]

[index]
target = "target"
camera = "camera"
camera_name = "cam"
target_id = "thorlabs_r3l3s7n1"
label = "circular"
scoring = { type = "msac" }        # RANSAC's scorer (the stack's SCORING_TAGS): MSAC on the board-plane residual (mm) of the Hungarian's one-to-one matches; its threshold is NOT stated here — it is half the target record's pitch (2.5 mm at 5 mm), the assignment's dustbin, derived in code (owner 2026-11-14)
seed_tolerance = 5.0
rng_seed = 1
min_assigned = 145

[index.ransac]
success_prob = 0.999               # the chrome configs' value of record since their renames (2026-11-12), above Estimation's default 0.99 (configs/default.toml [ransac])
max_trials = 10000                 # Estimation's default (configs/default.toml [ransac]): the cap, never reached (after4: every photograph stopped at min_trials)
min_trials = 200                   # owner 2026-11-14: twice the 100 that every photograph of after4 stopped at (the confidence rule is met far earlier — the grid sampler's draws are correct at the right parity), as margin

# RANSAC's local optimization (src/chrome_evaluation.jl register_grid; owner 2026-11-14): Estimation's Irls strategy at the Gaussian
# shape — plain least squares, not robust: the scorer's matches of the hypothesis are within its threshold by construction — on
# those matches, frozen (the GridPoseProblem's refine!: the board-plane residuals, mm, by Core's chart LM; the Hungarian is not
# re-run), at most max_iter iterations.
[index.local_optimization_strategy]
type = "irls"
loss = "gaussian"                 # plain least squares (the Gaussian shape: no width); its posterior iteration weighs the consensus set alone from Estimation 0.11.2
max_iter = 10

# The photograph's pixel refine after RANSAC (register_grid): Core's LevenbergMarquardt on Estimation's AbsolutePoseProblem through the camera on the final
# Hungarian's matches, plain least squares (owner 2026-11-14: no robust loss in the index). The MAD scale of its pixel residuals
# is recorded as the photograph's, pooled per set by the evaluate stage (its Huber width).
[index.refine_strategy]
type = "none"                     # a refine's least squares (optimization_strategy = nothing)

[index.excluded]

[runs.start_sizl_spline]
config = "configs/experiments/frontends.toml"
run = "schoeps.zoom48_f10_siemens_w20"
path = "camera.json"
stage = "evaluate"
provenance = "the start of cases sizl_spline_warped and sizl_spline_pinhole_warped: T. Schöps's central-generic (cell 150, window as frontends.toml states it: the Tamron f/8 set's arguments 150 / 40 in sensor pixels × ½) of the zoom set's 171 Siemens photographs, made by scripts/frontends.jl (configs/experiments/frontends.toml [schoeps.zoom48_f10_siemens_w20]) on Features' green cells and imported onto the raw grid through IO (camera.json)"

# The zoom set's Brown–Conrady start (owner GO 2026-11-17, T. Harder's Table 3 as he defined it; overrides the no-refits ruling for the zoom)
[inputs.start_sizl_bc5]
tier = "rc_baselines"
path = "geometric_accuracy/records/zoom48_f10_si_all/zoom48_f10_si_all_green_bc5_cv2.json"
sha256 = "92f3fc8a151cfd809da2b3a4885bfb193915567966dab19c53b4c7d2550feab2"   # sha256sum of the record of record (the B200 server, 2026-11-17)
stage = "evaluate"
provenance = "the start of cases sizl_bc5_warped and sizl_bc5_pinhole_warped (configs/experiments/radiometric_refinement.toml): OpenCV's cv2.calibrateCamera, its default model (k1 k2 p1 p2 k3), on Schöps's star detections (views >= 20 features: fe_si7.sh's MINF = 20, as every Siemens-set OpenCV record of record; OpenCV 4.12.0) of the zoom set's Schöps run of record (frontends.toml [schoeps.zoom48_f10_siemens_w20], dataset.bin) by T. Harder's experiments/tools/opencv_calibrate_schoeps.py (verbatim from v0.10.0 frontends_history/scripts; fe_si7.sh's arguments), converted to vgio/cameras/v4 by experiments/tools/ocv_record.jl (owner GO 2026-11-17)"

[evaluate]
index = "stage"
target = "target"
optimization_strategy = { type = "triggs", loss = "huber" }   # the rotation-centre refine (src/chrome_evaluation.jl evaluate_grid_models: Core's LevenbergMarquardt on Estimation's CameraPosesProblem of RotationCenterViews, the camera held): the Triggs-corrected Huber LM at the efficiency table's Huber constant for d = 2 (Core's efficiency_constant(HuberShape, 2)) × the index stage's pooled noise scale (a refine estimates none)
iterations = 80
profile_bins = 10
lens_coverage = "sensor"        # the chrome set's lens lights the whole sensor (src/image_region.jl): the radial profile about the sensor's centre out to its half-diagonal (2128, 1424; 2560.5 px as stated before 2026-11-15)
centre_rho = 0.4                # the summary's centre region: ρ = |𝐩 − centre| / rmax below 0.4 (the regions of record)
edge_rho = 0.6                  # the summary's edge region: ρ above 0.6
holdout = "on"                  # the parity-interleaved hold-out (motion_heldout, the paper's headline; owner 2026-11-15): each fit on one parity of the grid nodes, scoring the other
bootstrap = { resamples = 10000, seed = 20261115, alpha = 0.05 }   # the paired photograph bootstrap of the comparisons (src/chrome_evaluation.jl paired_differences, Eval's bootstrap_ci): 10,000 draws (the owner's count, 2026-11-15: the 2.5 % / 97.5 % tails each rest on 250 draws), StableRNG of the date of the ruling, the 95 % interval
# every refinement against its start (its label with _start for _refined) and every model against the Schöps baseline of its target (T. Schöps's own camera; the label's prefix): model − reference
# and the defocus ablation directly (owner GO 2026-11-17): each aperture + focus surface refinement against its pinhole refinement
comparisons = [
    {model = "sizl_spline_refined", reference = "sizl_spline_start"},
    {model = "sizl_spline_pinhole_refined", reference = "sizl_spline_start"},
    {model = "sizl_spline_refined", reference = "sizl_spline_pinhole_refined"},
    {model = "sizl_bc5_refined", reference = "sizl_bc5_start"},
    {model = "sizl_bc5_pinhole_refined", reference = "sizl_bc5_start"},
    {model = "sizl_bc5_refined", reference = "sizl_bc5_pinhole_refined"},
    {model = "sizl_bc5_start", reference = "sizl_spline_start"},
    {model = "sizl_bc5_refined", reference = "sizl_spline_start"},
    {model = "sizl_bc5_pinhole_refined", reference = "sizl_spline_start"},
]
models = [
    {label = "sizl_spline_start", kind = "schoeps", input = "start_sizl_spline"},   # the Schöps baseline: T. Schöps's OWN camera (his run's camera record), never a grid re-estimated from it (src/chrome_evaluation.jl check_schoeps_baseline)
    {label = "sizl_spline_refined", kind = "grid", case = "sizl_spline_warped"},
    {label = "sizl_spline_pinhole_refined", kind = "grid", case = "sizl_spline_pinhole_warped"},
    {label = "sizl_bc5_start", kind = "lens", input = "start_sizl_bc5"},
    {label = "sizl_bc5_refined", kind = "lens", case = "sizl_bc5_warped"},
    {label = "sizl_bc5_pinhole_refined", kind = "lens", case = "sizl_bc5_pinhole_warped"},
]
