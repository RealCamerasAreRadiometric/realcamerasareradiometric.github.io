# RadiometricCamera's entries for VisualGeometryToolkitCore's `check_duplication` (the monorepo's format,
# VisualGeometryToolkit.jl/DUPLICATION.toml). Owner ruling (2026-11-11): every duplicate is hoisted into its
# one owner; an entry is allowed only where the two things are NOT the same concept, and its reason is the
# one-line proof. An entry that stops matching anything is itself a finding: remove it. Paths are relative
# to this file.

