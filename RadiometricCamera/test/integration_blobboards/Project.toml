# Environment of the migration stages C and D (run_integration_tests.sh: test_session_outputs.jl, test_vgc_contract.jl): the package
# with the EXR reader of the fixture's truth maps (FileIO / ImageIO) and the stack packages the tests name. Until 2026-10-29 these
# stages ran in experiments/Project.toml, retired with that tree; this is its [deps] minus what the two scripts never load.
# A member of the repository's workspace (the root Project.toml's [workspace]), so it resolves with the package in the
# one root Manifest, on the stack's wave-10 compat:
#   julia --project=test/integration_blobboards -e 'using Pkg; Pkg.instantiate()'
